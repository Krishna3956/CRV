[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmcp"
version = "0.1.12"
description = "Observability SDK for MCP servers"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "observability", "analytics"]
classifiers = ["Programming Language :: Python :: 3"]
[project.urls]
Homepage = "https://trackmcp.com/docs/python"
Documentation = "https://trackmcp.com/docs/python"
Repository = "https://github.com/Krishna3956/CRV/tree/main/packages/python-sdk"
Issues = "https://github.com/Krishna3956/CRV/issues"

[project.scripts]
trackmcp = "trackmcp.cli:main"

[tool.setuptools.packages.find]
include = ["trackmcp*"]
