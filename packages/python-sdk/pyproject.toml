[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmcp"
version = "0.1.2"
description = "Observability SDK for MCP servers"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "observability", "analytics"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
trackmcp = "trackmcp.cli:main"

[tool.setuptools.packages.find]
include = ["trackmcp*"]
