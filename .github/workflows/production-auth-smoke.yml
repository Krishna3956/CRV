name: Authenticated production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Direct trusted HTTPS origin to verify (defaults to the current App Runner origin)"
        required: false
        default: "https://i95pzq2xh7.ap-south-1.awsapprunner.com"
        type: string
      release_ref:
        description: "Optional immutable 40-character commit SHA whose smoke contract should be used"
        required: false
        type: string
  workflow_run:
    workflows: ["Deploy to App Runner"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: authenticated-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # Keep the workflow harmless if the repository's default event policy
    # schedules a newly-added workflow on push; only an explicit dispatch may
    # consume operator-supplied production credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRACKMCP_AUTH_SMOKE_CONFIRM: I_UNDERSTAND_PRODUCTION_AUTH_SMOKE
      TRACKMCP_AUTH_SMOKE_BASE_URL: ${{ inputs.base_url || 'https://i95pzq2xh7.ap-south-1.awsapprunner.com' }}
      TRACKMCP_AUTH_SMOKE_KEY_A: ${{ secrets.TRACKMCP_AUTH_SMOKE_KEY_A }}
      TRACKMCP_AUTH_SMOKE_KEY_B: ${{ secrets.TRACKMCP_AUTH_SMOKE_KEY_B }}
      TRACKMCP_AUTH_SMOKE_WORKSPACE_A: ${{ secrets.TRACKMCP_AUTH_SMOKE_WORKSPACE_A }}
      TRACKMCP_AUTH_SMOKE_WORKSPACE_B: ${{ secrets.TRACKMCP_AUTH_SMOKE_WORKSPACE_B }}
      TRACKMCP_AUTH_SMOKE_REVOKED_KEY: ${{ secrets.TRACKMCP_AUTH_SMOKE_REVOKED_KEY }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select immutable release revision
        if: ${{ inputs.release_ref != '' }}
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_ref must be a full immutable 40-character commit SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$REQUESTED_RELEASE_REF"
          git checkout --detach "$REQUESTED_RELEASE_REF"

      - name: Verify immutable release revision
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RELEASE_REF" && ! "$REQUESTED_RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_ref must be a full immutable 40-character commit SHA."
            exit 1
          fi
          RELEASE_SHA=$(git rev-parse HEAD)
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out release revision is not an immutable full SHA."
            exit 1
          fi
          echo "TRACKMCP_AUTH_SMOKE_RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Check authenticated smoke inputs
        id: smoke_inputs
        env:
          TRACKMCP_AUTH_SMOKE_KEY_A: ${{ secrets.TRACKMCP_AUTH_SMOKE_KEY_A }}
          TRACKMCP_AUTH_SMOKE_KEY_B: ${{ secrets.TRACKMCP_AUTH_SMOKE_KEY_B }}
          TRACKMCP_AUTH_SMOKE_WORKSPACE_A: ${{ secrets.TRACKMCP_AUTH_SMOKE_WORKSPACE_A }}
          TRACKMCP_AUTH_SMOKE_WORKSPACE_B: ${{ secrets.TRACKMCP_AUTH_SMOKE_WORKSPACE_B }}
        run: |
          missing=()
          for name in TRACKMCP_AUTH_SMOKE_KEY_A TRACKMCP_AUTH_SMOKE_KEY_B TRACKMCP_AUTH_SMOKE_WORKSPACE_A TRACKMCP_AUTH_SMOKE_WORKSPACE_B TRACKMCP_AUTH_SMOKE_REVOKED_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf 'Authenticated production smoke skipped; missing required repository secrets: %s\n' "${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated production smoke inputs are configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run read-only authenticated smoke
        if: steps.smoke_inputs.outputs.configured == 'true'
        working-directory: trackmcp-nextjs
        run: TRACKMCP_AUTH_SMOKE_REPORT="$RUNNER_TEMP/trackmcp-production-auth-smoke.json" node scripts/production-auth-smoke.mjs

      - name: Upload redacted authenticated smoke evidence
        if: always() && steps.smoke_inputs.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-auth-smoke-${{ inputs.release_ref || github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/trackmcp-production-auth-smoke.json
          if-no-files-found: warn
