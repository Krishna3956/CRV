name: Probe Supabase source restore in staging

# This workflow is deliberately manual and staging-only. It validates the
# existing encrypted source export, restores it into a temporary database on
# the isolated staging host, checks schema/auth compatibility, and removes the
# temporary database. It never writes to Supabase Cloud, production, DNS, the
# active staging database, or application configuration.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESTORE_STAGING_SOURCE_PROBE to run the isolated restore probe"
        required: true
        type: string
      object_prefix:
        description: "S3 prefix, for example source-exports/1234567890"
        required: true
        type: string
      stack_name:
        description: "Existing isolated staging CloudFormation stack"
        required: true
        default: trackmcp-supabase-staging-24
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
  BACKUP_BUCKET_PREFIX: trackmcp-supabase-backups

jobs:
  restore-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed restore probe
        uses: actions/checkout@v4

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate the explicit staging guard and object prefix
        env:
          CONFIRM: ${{ inputs.confirm }}
          OBJECT_PREFIX: ${{ inputs.object_prefix }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "RESTORE_STAGING_SOURCE_PROBE" ]] || {
            echo "::error::The confirm input must be exactly RESTORE_STAGING_SOURCE_PROBE. No object or database was touched."
            exit 1
          }
          [[ "$OBJECT_PREFIX" =~ ^source-exports/[0-9]+$ ]] || {
            echo "::error::The object prefix must match source-exports/<numeric-workflow-run-id>. No restore was attempted."
            exit 1
          }

      - name: Verify the private encrypted filtered SQL export
        id: artifact
        env:
          OBJECT_PREFIX: ${{ inputs.object_prefix }}
        run: |
          set -euo pipefail
          umask 077
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${BACKUP_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"
          ARCHIVE_FILE="/tmp/trackmcp-source-restore-probe.tar.gz"
          EXTRACT_DIR="/tmp/trackmcp-source-restore-probe-files"
          MANIFEST_FILE="/tmp/trackmcp-source-restore-probe.manifest.txt"
          EXPECTED_FILE="/tmp/trackmcp-source-restore-probe.expected.txt"
          ACTUAL_FILE="/tmp/trackmcp-source-restore-probe.actual.txt"
          trap 'rm -rf "$EXTRACT_DIR"; rm -f "$ARCHIVE_FILE" "$MANIFEST_FILE" "$EXPECTED_FILE" "$ACTUAL_FILE"' EXIT

          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
          ENCRYPTION=$(aws s3api head-object --bucket "$BUCKET_NAME" \
            --key "$OBJECT_PREFIX/trackmcp-supabase-source.tar.gz" \
            --region "$AWS_REGION" --query ServerSideEncryption --output text)
          [[ "$ENCRYPTION" == "AES256" ]] || {
            echo "::error::The source archive is not encrypted with the expected AES256 server-side encryption. No restore was attempted."
            exit 1
          }
          aws s3 cp "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/trackmcp-supabase-source.tar.gz" \
            "$ARCHIVE_FILE" --only-show-errors
          aws s3 cp "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/manifest.txt" \
            "$MANIFEST_FILE" --only-show-errors

          grep -Fx 'source_url=redacted' "$MANIFEST_FILE" >/dev/null
          grep -Fx 'export_type=supabase-filtered-sql-dump' "$MANIFEST_FILE" >/dev/null
          SHA256=$(sha256sum "$ARCHIVE_FILE" | awk '{print $1}')
          EXPECTED_SHA256=$(sed -n 's/^archive_sha256=//p' "$MANIFEST_FILE")
          [[ -n "$EXPECTED_SHA256" && "$SHA256" == "$EXPECTED_SHA256" ]] || {
            echo "::error::Source export checksum mismatch. No restore was attempted."
            exit 1
          }
          BYTES=$(stat -c '%s' "$ARCHIVE_FILE")
          EXPECTED_BYTES=$(sed -n 's/^archive_bytes=//p' "$MANIFEST_FILE")
          [[ -n "$EXPECTED_BYTES" && "$BYTES" == "$EXPECTED_BYTES" ]] || {
            echo "::error::Source export byte count mismatch. No restore was attempted."
            exit 1
          }
          printf '%s\n' data.sql roles.sql schema.sql | sort > "$EXPECTED_FILE"
          tar -tzf "$ARCHIVE_FILE" | sed 's#^\./##' | sort > "$ACTUAL_FILE"
          diff -u "$EXPECTED_FILE" "$ACTUAL_FILE" >/dev/null || {
            echo "::error::The filtered source archive does not contain exactly roles.sql, schema.sql, and data.sql. No restore was attempted."
            exit 1
          }
          mkdir -m 0700 "$EXTRACT_DIR"
          tar -xzf "$ARCHIVE_FILE" -C "$EXTRACT_DIR"
          for file in roles.sql schema.sql data.sql; do
            test -s "$EXTRACT_DIR/$file"
            FILE_SHA256=$(sha256sum "$EXTRACT_DIR/$file" | awk '{print $1}')
            FILE_BYTES=$(stat -c '%s' "$EXTRACT_DIR/$file")
            EXPECTED_FILE_SHA256=$(sed -n "s/^${file%.*}_sha256=//p" "$MANIFEST_FILE")
            EXPECTED_FILE_BYTES=$(sed -n "s/^${file%.*}_bytes=//p" "$MANIFEST_FILE")
            [[ "$FILE_SHA256" == "$EXPECTED_FILE_SHA256" && "$FILE_BYTES" == "$EXPECTED_FILE_BYTES" ]] || {
              echo "::error::Checksum or byte count mismatch for $file. No restore was attempted."
              exit 1
            }
          done
          grep -E 'COPY ("auth"|auth)\.("users"|users)' "$EXTRACT_DIR/data.sql" >/dev/null || {
            echo "::error::The filtered data export does not contain the auth.users relation. No restore was attempted."
            exit 1
          }
          OBJECT_KEY="$OBJECT_PREFIX/trackmcp-supabase-source.tar.gz"
          MANIFEST_KEY="$OBJECT_PREFIX/manifest.txt"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "object_key=$OBJECT_KEY" >> "$GITHUB_OUTPUT"
          echo "manifest_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sql_file_count=3" >> "$GITHUB_OUTPUT"
          echo "Verified the private encrypted filtered SQL export; source URL and application rows were not printed."

      - name: Package the isolated restore script
        id: package
        env:
          BUCKET_NAME: ${{ steps.artifact.outputs.bucket_name }}
          OBJECT_KEY: ${{ steps.artifact.outputs.object_key }}
        run: |
          set -euo pipefail
          SCRIPT_OBJECT="staging/source-restore-probe-${GITHUB_RUN_ID}.sh"
          cat > /tmp/trackmcp-source-restore-probe.sh <<'REMOTE_EOF'
          set -euo pipefail

          cd /opt/trackmcp-supabase/project
          test -f .env
          test -f docker-compose.yml
          install -d -m 0750 /opt/trackmcp-supabase/restore-probes
          ARCHIVE_FILE="/opt/trackmcp-supabase/restore-probes/source-${RESTORE_ID}.tar.gz"
          EXPORT_DIR="/opt/trackmcp-supabase/restore-probes/source-${RESTORE_ID}"
          MANIFEST_FILE="/opt/trackmcp-supabase/restore-probes/source-${RESTORE_ID}.manifest.txt"
          EXPECTED_FILE="/opt/trackmcp-supabase/restore-probes/source-${RESTORE_ID}.expected.txt"
          ACTUAL_FILE="/opt/trackmcp-supabase/restore-probes/source-${RESTORE_ID}.actual.txt"
          RESTORE_DATABASE="trackmcp_restore_${RESTORE_ID}"
          cleanup() {
            status=$?
            if [[ -n "${RESTORE_DATABASE:-}" ]]; then
              docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -c "DROP DATABASE IF EXISTS ${RESTORE_DATABASE}" >/dev/null 2>&1 || true
            fi
            rm -rf "$ARCHIVE_FILE" "$EXPORT_DIR" "$MANIFEST_FILE" "$EXPECTED_FILE" "$ACTUAL_FILE"
            if [[ "$status" -ne 0 ]]; then
              echo "STAGING_SOURCE_RESTORE_PROBE_FAILED status=${status}"
            fi
          }
          trap cleanup EXIT
          aws s3 cp "s3://${MIGRATION_BUCKET}/${MIGRATION_OBJECT}" "$ARCHIVE_FILE" --only-show-errors
          aws s3 cp "s3://${MIGRATION_BUCKET}/${MIGRATION_MANIFEST}" "$MANIFEST_FILE" --only-show-errors
          grep -Fx 'source_url=redacted' "$MANIFEST_FILE" >/dev/null
          grep -Fx 'export_type=supabase-filtered-sql-dump' "$MANIFEST_FILE" >/dev/null
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE_FILE" | awk '{print $1}')
          EXPECTED_ARCHIVE_SHA256=$(sed -n 's/^archive_sha256=//p' "$MANIFEST_FILE")
          ARCHIVE_BYTES=$(stat -c '%s' "$ARCHIVE_FILE")
          EXPECTED_ARCHIVE_BYTES=$(sed -n 's/^archive_bytes=//p' "$MANIFEST_FILE")
          [[ -n "$EXPECTED_ARCHIVE_SHA256" && "$ARCHIVE_SHA256" == "$EXPECTED_ARCHIVE_SHA256" ]] || { echo STAGING_SOURCE_RESTORE_ARCHIVE_CHECKSUM_MISMATCH; exit 1; }
          [[ -n "$EXPECTED_ARCHIVE_BYTES" && "$ARCHIVE_BYTES" == "$EXPECTED_ARCHIVE_BYTES" ]] || { echo STAGING_SOURCE_RESTORE_ARCHIVE_BYTES_MISMATCH; exit 1; }
          printf '%s\n' data.sql roles.sql schema.sql | sort > "$EXPECTED_FILE"
          tar -tzf "$ARCHIVE_FILE" | sed 's#^\./##' | sort > "$ACTUAL_FILE"
          diff -u "$EXPECTED_FILE" "$ACTUAL_FILE" >/dev/null || { echo STAGING_SOURCE_RESTORE_ARCHIVE_CONTENTS_MISMATCH; exit 1; }
          mkdir -m 0700 "$EXPORT_DIR"
          tar -xzf "$ARCHIVE_FILE" -C "$EXPORT_DIR"
          for file in roles.sql schema.sql data.sql; do
            test -s "$EXPORT_DIR/$file" || { echo STAGING_SOURCE_RESTORE_SQL_FILE_MISSING file="$file"; exit 1; }
            FILE_SHA256=$(sha256sum "$EXPORT_DIR/$file" | awk '{print $1}')
            EXPECTED_FILE_SHA256=$(sed -n "s/^${file%.*}_sha256=//p" "$MANIFEST_FILE")
            [[ "$FILE_SHA256" == "$EXPECTED_FILE_SHA256" ]] || { echo STAGING_SOURCE_RESTORE_SQL_CHECKSUM_MISMATCH file="$file"; exit 1; }
          done
          grep -E 'COPY ("auth"|auth)\.("users"|users)' "$EXPORT_DIR/data.sql" >/dev/null || {
            echo STAGING_SOURCE_RESTORE_AUTH_DATA_MISSING
            exit 1
          }

          docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ${RESTORE_DATABASE}"
          # Do not apply roles.sql to the active staging cluster: roles are
          # cluster-scoped and would mutate the shared staging environment.
          # The final restore into a fresh destination must apply roles.sql
          # before schema.sql/data.sql using Supabase's documented procedure.
          docker compose exec -T db psql -U postgres -d "$RESTORE_DATABASE" \
            -v ON_ERROR_STOP=1 -f - < "$EXPORT_DIR/schema.sql"
          docker compose exec -T db psql -U postgres -d "$RESTORE_DATABASE" \
            -v ON_ERROR_STOP=1 \
            -c 'SET session_replication_role = replica' \
            -f - < "$EXPORT_DIR/data.sql"

          PUBLIC_TABLES=$(docker compose exec -T db psql -U postgres -d "$RESTORE_DATABASE" -At \
            -c "select count(*) from information_schema.tables where table_schema = 'public'")
          AUTH_USERS_TABLE=$(docker compose exec -T db psql -U postgres -d "$RESTORE_DATABASE" -At \
            -c "select coalesce(to_regclass('auth.users')::text, 'missing')")
          AUTH_USER_COUNT=$(docker compose exec -T db psql -U postgres -d "$RESTORE_DATABASE" -At \
            -c "select count(*) from auth.users")
          [[ "$PUBLIC_TABLES" =~ ^[0-9]+$ && "$PUBLIC_TABLES" -gt 0 ]] || {
            echo STAGING_SOURCE_RESTORE_PUBLIC_SCHEMA_MISSING
            exit 1
          }
          [[ "$AUTH_USERS_TABLE" == "auth.users" ]] || {
            echo STAGING_SOURCE_RESTORE_AUTH_SCHEMA_MISSING
            exit 1
          }
          [[ "$AUTH_USER_COUNT" =~ ^[0-9]+$ && "$AUTH_USER_COUNT" -gt 0 ]] || {
            echo STAGING_SOURCE_RESTORE_AUTH_DATA_EMPTY
            exit 1
          }

          echo "STAGING_SOURCE_RESTORE_PROBE_PASSED sql_files=3 public_tables=${PUBLIC_TABLES} auth_users_table=present auth_user_count=${AUTH_USER_COUNT}"
          echo "STAGING_SOURCE_RESTORE_PROBE_CLEANED temporary_database=${RESTORE_DATABASE}"
          REMOTE_EOF
          aws s3 cp /tmp/trackmcp-source-restore-probe.sh \
            "s3://${BUCKET_NAME}/${SCRIPT_OBJECT}" --sse AES256 --only-show-errors
          echo "script_object=$SCRIPT_OBJECT" >> "$GITHUB_OUTPUT"
          echo "Packaged the bounded staging-only restore probe; no database command has run yet."

      - name: Restore into a temporary staging database and clean it up
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          BUCKET_NAME: ${{ steps.artifact.outputs.bucket_name }}
          OBJECT_KEY: ${{ steps.artifact.outputs.object_key }}
          MANIFEST_KEY: ${{ steps.artifact.outputs.manifest_key }}
          SCRIPT_OBJECT: ${{ steps.package.outputs.script_object }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue' --output text)
          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]] || {
            echo "::error::The selected staging stack has no EC2 instance output. No restore was attempted."
            exit 1
          }
          REMOTE_COMMAND="export MIGRATION_BUCKET='$BUCKET_NAME' MIGRATION_OBJECT='$OBJECT_KEY' MIGRATION_MANIFEST='$MANIFEST_KEY' RESTORE_ID='$GITHUB_RUN_ID' SCRIPT_OBJECT='$SCRIPT_OBJECT'; aws s3 cp \"s3://\${MIGRATION_BUCKET}/\${SCRIPT_OBJECT}\" /tmp/trackmcp-source-restore-probe.sh --only-show-errors; chmod 0700 /tmp/trackmcp-source-restore-probe.sh; exec bash /tmp/trackmcp-source-restore-probe.sh"
          COMMANDS_JSON=$(jq -Rn --arg command "$REMOTE_COMMAND" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TrackMCP isolated source restore compatibility probe" \
            --timeout-seconds 1500 \
            --parameters "$COMMANDS_JSON" \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION"
          WAITER_STATUS=$?
          set -e
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text)
          ERROR_OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text)
          echo "SSM command status: $STATUS"
          echo "$OUTPUT"
          if [[ -n "$ERROR_OUTPUT" && "$ERROR_OUTPUT" != "None" ]]; then
            echo "$ERROR_OUTPUT"
          fi
          if [[ "$WAITER_STATUS" -ne 0 || "$STATUS" != "Success" || "$OUTPUT" != *STAGING_SOURCE_RESTORE_PROBE_PASSED* || "$OUTPUT" != *STAGING_SOURCE_RESTORE_PROBE_CLEANED* ]]; then
            echo "::error::The isolated source restore probe did not report a clean compatibility result."
            exit 1
          fi

      - name: Record bounded restore evidence
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          OBJECT_PREFIX: ${{ inputs.object_prefix }}
          ARCHIVE_BYTES: ${{ steps.artifact.outputs.archive_bytes }}
          SQL_FILE_COUNT: ${{ steps.artifact.outputs.sql_file_count }}
        run: |
          set -euo pipefail
          echo "Verified and restored filtered SQL metadata from prefix $OBJECT_PREFIX into a temporary database on isolated stack $STACK_NAME."
          echo "Archive bytes=$ARCHIVE_BYTES sql_files=$SQL_FILE_COUNT; the temporary database was dropped after schema/auth compatibility checks."
          echo "Supabase Cloud, production DNS, App Runner configuration, live traffic, active staging database, and credentials were not changed."
