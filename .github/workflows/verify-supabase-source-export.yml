name: Verify Supabase Cloud source export

# This workflow is deliberately manual and read-only. It verifies an export
# artifact already present in the private, versioned S3 backup bucket. It does
# not connect to Supabase Cloud, restore a database, change staging, or delete
# any object.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_SOURCE_BACKUP to verify an existing export"
        required: true
        type: string
      object_prefix:
        description: "S3 prefix, for example source-exports/1234567890"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
  BACKUP_BUCKET_PREFIX: trackmcp-supabase-backups

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate the explicit verification guard and object prefix
        env:
          CONFIRM: ${{ inputs.confirm }}
          OBJECT_PREFIX: ${{ inputs.object_prefix }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "VERIFY_SOURCE_BACKUP" ]] || {
            echo "::error::The confirm input must be exactly VERIFY_SOURCE_BACKUP. No object was read."
            exit 1
          }
          [[ "$OBJECT_PREFIX" =~ ^source-exports/[0-9]+$ ]] || {
            echo "::error::The object prefix must match source-exports/<numeric-workflow-run-id>."
            exit 1
          }

      - name: Verify checksum, manifest, encryption, and filtered SQL files
        env:
          OBJECT_PREFIX: ${{ inputs.object_prefix }}
        run: |
          set -euo pipefail
          umask 077
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${BACKUP_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"
          ARCHIVE_FILE="/tmp/trackmcp-source-export.tar.gz"
          EXTRACT_DIR="/tmp/trackmcp-source-export-files"
          MANIFEST_FILE="/tmp/trackmcp-source-export.manifest.txt"
          EXPECTED_FILE="/tmp/trackmcp-source-export.expected.txt"
          ACTUAL_FILE="/tmp/trackmcp-source-export.actual.txt"
          trap 'rm -rf "$EXTRACT_DIR"; rm -f "$ARCHIVE_FILE" "$MANIFEST_FILE" "$EXPECTED_FILE" "$ACTUAL_FILE"' EXIT

          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
          aws s3api head-object --bucket "$BUCKET_NAME" \
            --key "$OBJECT_PREFIX/trackmcp-supabase-source.tar.gz" \
            --region "$AWS_REGION" \
            --query '{bytes:ContentLength,encryption:ServerSideEncryption,version:VersionId}' \
            --output json
          aws s3 cp "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/trackmcp-supabase-source.tar.gz" \
            "$ARCHIVE_FILE" --only-show-errors
          aws s3 cp "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/manifest.txt" \
            "$MANIFEST_FILE" --only-show-errors

          grep -Fx 'source_url=redacted' "$MANIFEST_FILE" >/dev/null
          grep -Fx 'export_type=supabase-filtered-sql-dump' "$MANIFEST_FILE" >/dev/null
          SHA256=$(sha256sum "$ARCHIVE_FILE" | awk '{print $1}')
          EXPECTED_SHA256=$(sed -n 's/^archive_sha256=//p' "$MANIFEST_FILE")
          [[ -n "$EXPECTED_SHA256" && "$SHA256" == "$EXPECTED_SHA256" ]] || {
            echo "::error::Source export checksum mismatch. No restore was attempted."
            exit 1
          }
          BYTES=$(stat -c '%s' "$ARCHIVE_FILE")
          EXPECTED_BYTES=$(sed -n 's/^archive_bytes=//p' "$MANIFEST_FILE")
          [[ -n "$EXPECTED_BYTES" && "$BYTES" == "$EXPECTED_BYTES" ]] || {
            echo "::error::Source export byte count mismatch. No restore was attempted."
            exit 1
          }

          printf '%s\n' data.sql roles.sql schema.sql | sort > "$EXPECTED_FILE"
          tar -tzf "$ARCHIVE_FILE" | sed 's#^\./##' | sort > "$ACTUAL_FILE"
          diff -u "$EXPECTED_FILE" "$ACTUAL_FILE" >/dev/null || {
            echo "::error::The filtered source archive does not contain exactly roles.sql, schema.sql, and data.sql. No restore was attempted."
            exit 1
          }
          mkdir -m 0700 "$EXTRACT_DIR"
          tar -xzf "$ARCHIVE_FILE" -C "$EXTRACT_DIR"
          for file in roles.sql schema.sql data.sql; do
            test -s "$EXTRACT_DIR/$file"
            FILE_SHA256=$(sha256sum "$EXTRACT_DIR/$file" | awk '{print $1}')
            FILE_BYTES=$(stat -c '%s' "$EXTRACT_DIR/$file")
            EXPECTED_FILE_SHA256=$(sed -n "s/^${file%.*}_sha256=//p" "$MANIFEST_FILE")
            EXPECTED_FILE_BYTES=$(sed -n "s/^${file%.*}_bytes=//p" "$MANIFEST_FILE")
            [[ "$FILE_SHA256" == "$EXPECTED_FILE_SHA256" && "$FILE_BYTES" == "$EXPECTED_FILE_BYTES" ]] || {
              echo "::error::Checksum or byte count mismatch for $file. No restore was attempted."
              exit 1
            }
          done
          ROLE_LINES=$(wc -l < "$EXTRACT_DIR/roles.sql" | tr -d ' ')
          SCHEMA_LINES=$(wc -l < "$EXTRACT_DIR/schema.sql" | tr -d ' ')
          DATA_LINES=$(wc -l < "$EXTRACT_DIR/data.sql" | tr -d ' ')
          grep -E 'COPY ("auth"|auth)\.("users"|users)' "$EXTRACT_DIR/data.sql" >/dev/null || {
            echo "::error::The filtered data export does not contain the auth.users relation. No restore was attempted."
            exit 1
          }
          [[ "$ROLE_LINES" -gt 0 && "$SCHEMA_LINES" -gt 0 && "$DATA_LINES" -gt 0 ]] || {
            echo "::error::One or more filtered SQL files are empty. No restore was attempted."
            exit 1
          }
          echo "Verified encrypted filtered source export: bucket=$BUCKET_NAME prefix=$OBJECT_PREFIX archive_bytes=$BYTES archive_sha256=$SHA256 roles_lines=$ROLE_LINES schema_lines=$SCHEMA_LINES data_lines=$DATA_LINES"
          echo "No source connection was opened, no database was restored, and no S3 object was changed or deleted."
