name: Export Supabase Cloud source backup

# This workflow is intentionally manual. It performs a read-only PostgreSQL
# logical export from the preserved Supabase Cloud project and stores the
# encrypted archive in the existing private, versioned AWS backup bucket.
# It never writes to Supabase Cloud, production, DNS, or live application
# configuration.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type EXPORT_SOURCE_BACKUP to run the read-only export"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
  BACKUP_BUCKET_PREFIX: trackmcp-supabase-backups
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed export workflow
        uses: actions/checkout@v4

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate the explicit export guard
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "EXPORT_SOURCE_BACKUP" ]] || {
            echo "::error::The confirm input must be exactly EXPORT_SOURCE_BACKUP. No source connection was attempted."
            exit 1
          }

      - name: Validate the source connection secret without printing it
        env:
          SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_SOURCE_DB_URL:-}" ]] || {
            echo "::error::Repository secret SUPABASE_SOURCE_DB_URL is missing. Add the source PostgreSQL connection string without posting it in chat."
            exit 1
          }

      - name: Install the PostgreSQL client and pinned Supabase CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version

      - name: Verify source connectivity without reading application rows
        env:
          SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          pg_isready --dbname="$SUPABASE_SOURCE_DB_URL" --timeout=15

      - name: Create and upload the filtered Supabase logical export
        env:
          SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          umask 077
          EXPORT_DIR="/tmp/trackmcp-supabase-source-${GITHUB_RUN_ID}"
          ARCHIVE_FILE="/tmp/trackmcp-supabase-source-${GITHUB_RUN_ID}.tar.gz"
          MANIFEST_FILE="/tmp/trackmcp-supabase-source-${GITHUB_RUN_ID}.manifest.txt"
          trap 'rm -rf "$EXPORT_DIR"; rm -f "$ARCHIVE_FILE" "$MANIFEST_FILE"' EXIT
          mkdir -m 0700 "$EXPORT_DIR"

          SUPABASE_CLI=(npx --yes "supabase@${SUPABASE_CLI_VERSION}")
          "${SUPABASE_CLI[@]}" db dump \
            --db-url "$SUPABASE_SOURCE_DB_URL" \
            --file "$EXPORT_DIR/roles.sql" \
            --role-only
          "${SUPABASE_CLI[@]}" db dump \
            --db-url "$SUPABASE_SOURCE_DB_URL" \
            --file "$EXPORT_DIR/schema.sql"
          "${SUPABASE_CLI[@]}" db dump \
            --db-url "$SUPABASE_SOURCE_DB_URL" \
            --file "$EXPORT_DIR/data.sql" \
            --use-copy \
            --data-only

          tar -czf "$ARCHIVE_FILE" -C "$EXPORT_DIR" roles.sql schema.sql data.sql

          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE_FILE" | awk '{print $1}')
          ARCHIVE_BYTES=$(stat -c '%s' "$ARCHIVE_FILE")
          ROLES_SHA256=$(sha256sum "$EXPORT_DIR/roles.sql" | awk '{print $1}')
          ROLES_BYTES=$(stat -c '%s' "$EXPORT_DIR/roles.sql")
          SCHEMA_SHA256=$(sha256sum "$EXPORT_DIR/schema.sql" | awk '{print $1}')
          SCHEMA_BYTES=$(stat -c '%s' "$EXPORT_DIR/schema.sql")
          DATA_SHA256=$(sha256sum "$EXPORT_DIR/data.sql" | awk '{print $1}')
          DATA_BYTES=$(stat -c '%s' "$EXPORT_DIR/data.sql")
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${BACKUP_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"
          OBJECT_PREFIX="source-exports/${GITHUB_RUN_ID}"

          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
          cat > "$MANIFEST_FILE" <<EOF
          export_type=supabase-filtered-sql-dump
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          supabase_cli_version=${SUPABASE_CLI_VERSION}
          archive_file=trackmcp-supabase-source.tar.gz
          archive_bytes=${ARCHIVE_BYTES}
          archive_sha256=${ARCHIVE_SHA256}
          roles_bytes=${ROLES_BYTES}
          roles_sha256=${ROLES_SHA256}
          schema_bytes=${SCHEMA_BYTES}
          schema_sha256=${SCHEMA_SHA256}
          data_bytes=${DATA_BYTES}
          data_sha256=${DATA_SHA256}
          source_url=redacted
          source_rows=not_printed
          EOF

          aws s3 cp "$ARCHIVE_FILE" \
            "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/trackmcp-supabase-source.tar.gz" \
            --sse AES256 --only-show-errors
          aws s3 cp "$MANIFEST_FILE" \
            "s3://${BUCKET_NAME}/${OBJECT_PREFIX}/manifest.txt" \
            --sse AES256 --only-show-errors

          echo "Uploaded encrypted filtered Supabase logical export metadata to s3://${BUCKET_NAME}/${OBJECT_PREFIX}/."
          echo "The SQL files, source rows, and source connection string were not printed."
