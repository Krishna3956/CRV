name: Publish SDK packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (all is the standard release train)"
        required: true
        type: choice
        default: all
        options: [all, typescript, python, cli]
      confirm:
        description: "Type RELEASE_TRAIN_APPROVED only for a reviewed, batched release"
        required: true
        type: string
      single_package_reason:
        description: "Required only for an explicitly approved single-package emergency release"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
      attestations: write # GitHub build provenance for package artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require reviewed release-train confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "RELEASE_TRAIN_APPROVED" ]]; then
            echo "::error::Package publication is release-train gated. Review and batch the package changes, then rerun with confirm=RELEASE_TRAIN_APPROVED."
            exit 1
          fi
          echo "Release-train confirmation accepted for the selected package."
      - name: Require an explicit exception for single-package publication
        if: inputs.package != 'all'
        env:
          SINGLE_PACKAGE_REASON: ${{ inputs.single_package_reason }}
        run: |
          set -euo pipefail
          normalized_reason="${SINGLE_PACKAGE_REASON//[[:space:]]/}"
          if [[ -z "$normalized_reason" ]]; then
            echo "::error::Single-package publication is an exception. Use package=all, or provide a non-empty single_package_reason after emergency review."
            exit 1
          fi
          if (( ${#SINGLE_PACKAGE_REASON} > 240 )); then
            echo "::error::single_package_reason must be 240 characters or fewer."
            exit 1
          fi
          echo "Single-package exception reason supplied (content intentionally omitted from logs)."
      - name: Audit all release artifacts before publishing
        working-directory: trackmcp-nextjs
        run: npm run test:package-release-audit
      - name: Preflight all release-train registry versions
        if: inputs.package == 'all'
        working-directory: trackmcp-nextjs
        run: |
          set -euo pipefail
          sdk_version=$(node -p "require('./packages/typescript-sdk/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          python_version=$(python -c 'import tomllib; print(tomllib.load(open("../packages/python-sdk/pyproject.toml", "rb"))["project"]["version"])')
          if npm view "@trackmcp/sdk@${sdk_version}" version --json >/dev/null 2>&1; then
            echo "@trackmcp/sdk@${sdk_version} already exists on npm; reconcile the release train before publishing."
            exit 1
          fi
          if npm view "@trackmcp/cli@${cli_version}" version --json >/dev/null 2>&1; then
            echo "@trackmcp/cli@${cli_version} already exists on npm; reconcile the release train before publishing."
            exit 1
          fi
          if curl --fail --silent --show-error "https://pypi.org/pypi/trackmcp/${python_version}/json" >/dev/null; then
            echo "trackmcp==${python_version} already exists on PyPI; reconcile the release train before publishing."
            exit 1
          fi
          echo "All release-train versions are absent from npm/PyPI; package uploads may proceed sequentially."
      - name: Publish TypeScript SDK
        if: inputs.package == 'typescript' || inputs.package == 'all'
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The SDK's Node/Next boundary test resolves the web app's pinned
          # Next.js dependency from the parent workspace. Install that clean
          # dependency set before running the package gate.
          npm --prefix ../.. ci
          npm ci
          # npm's legacy quick-audit endpoint can return HTTP 400 for a valid
          # workspace lockfile while the registry migrates to bulk advisory.
          # Keep real vulnerability failures blocking, but do not turn that
          # registry protocol response into a false publication failure.
          set +e
          npm audit --audit-level=high >"$RUNNER_TEMP/trackmcp-npm-audit.log" 2>&1
          AUDIT_STATUS=$?
          set -e
          if [[ "$AUDIT_STATUS" -ne 0 ]]; then
            if grep -Eiq "Invalid package tree|audit endpoint returned an error|endpoint is being retired" "$RUNNER_TEMP/trackmcp-npm-audit.log"; then
              echo "npm audit endpoint returned a registry-side compatibility error; release artifact audit remains authoritative."
            else
              cat "$RUNNER_TEMP/trackmcp-npm-audit.log"
              exit "$AUDIT_STATUS"
            fi
          fi
          npm test
          npm run test:packed-consumer
          npm pack --pack-destination "$RUNNER_TEMP"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@trackmcp/sdk@${PACKAGE_VERSION}" version --json >/dev/null 2>&1; then
            echo "@trackmcp/sdk@${PACKAGE_VERSION} already exists on npm; bump the package version before publishing."
            exit 1
          fi
          npm publish --provenance --access public
      - name: Verify TypeScript SDK registry publication
        if: inputs.package == 'typescript' || inputs.package == 'all'
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            if METADATA=$(npm view "@trackmcp/sdk@${PACKAGE_VERSION}" --json 2>/dev/null); then
              VERSION=$(printf '%s' "$METADATA" | jq -r '.version // ""')
              INTEGRITY=$(printf '%s' "$METADATA" | jq -r '.dist.integrity // ""')
              TARBALL=$(printf '%s' "$METADATA" | jq -r '.dist.tarball // ""')
              if [[ "$VERSION" == "$PACKAGE_VERSION" && "$INTEGRITY" =~ ^sha512-[A-Za-z0-9+/=]+$ && "$TARBALL" == https://registry.npmjs.org/* ]]; then
                echo "Verified @trackmcp/sdk@${PACKAGE_VERSION} on the public registry with integrity ${INTEGRITY}."
                exit 0
              fi
            fi
            echo "Registry propagation pending for @trackmcp/sdk@${PACKAGE_VERSION} (attempt ${attempt}/12)."
            sleep 15
          done
          echo "::error::npm publication succeeded but @trackmcp/sdk@${PACKAGE_VERSION} did not become verifiable within the bounded propagation window."
          exit 1
      - name: Attest TypeScript SDK artifact
        if: inputs.package == 'typescript' || inputs.package == 'all'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/*.tgz
      - name: Publish TrackMCP CLI
        if: inputs.package == 'cli' || inputs.package == 'all'
        working-directory: trackmcp-nextjs/packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm test
          npm run test:packed-consumer
          npm pack --pack-destination "$RUNNER_TEMP"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@trackmcp/cli@${PACKAGE_VERSION}" version --json >/dev/null 2>&1; then
            echo "@trackmcp/cli@${PACKAGE_VERSION} already exists on npm; bump the package version before publishing."
            exit 1
          fi
          npm publish --provenance --access public
      - name: Attest TrackMCP CLI artifact
        if: inputs.package == 'cli' || inputs.package == 'all'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/*.tgz
      - name: Publish Python SDK
        if: inputs.package == 'python' || inputs.package == 'all'
        working-directory: packages/python-sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install build twine
          python -m unittest discover -s tests -v
          python -m build
          python -m twine check dist/*
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if curl --fail --silent --show-error "https://pypi.org/pypi/trackmcp/${PACKAGE_VERSION}/json" >/dev/null; then
            echo "trackmcp==${PACKAGE_VERSION} already exists on PyPI; bump the package version before publishing."
            exit 1
          fi
          python -m twine upload dist/*
      - name: Attest Python SDK artifacts
        if: inputs.package == 'python' || inputs.package == 'all'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/python-sdk/dist/*
