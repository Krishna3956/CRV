name: Founder OS refresh health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed mainline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to AWS for scheduler metrics
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect bounded AWS scheduler evidence
        continue-on-error: true
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/refresh-health/aws-scheduler.json"
          mkdir -p "$(dirname "$output")"
          stack_output=$(aws cloudformation describe-stacks \
            --stack-name trackmcp-refresh-scheduler \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RefreshSchedulerFunctionArn`].OutputValue | [0]' \
            --output text 2>/dev/null || true)
          function_name="${stack_output##*:function:}"
          if [[ -z "$function_name" || "$function_name" == "None" || "$function_name" == "$stack_output" ]]; then
            printf '{"enabled":true,"datapoints":[],"invocations":0,"errors":0}\n' > "$output"
            echo "::warning::Refresh scheduler function ARN was not available for health evidence."
            exit 0
          fi
          end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_time=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          queries=$(jq -nc --arg function_name "$function_name" '[
            {Id:"invocations",MetricStat:{Metric:{Namespace:"AWS/Lambda",MetricName:"Invocations",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"errors",MetricStat:{Metric:{Namespace:"AWS/Lambda",MetricName:"Errors",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"scheduled_successes",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"ScheduledSuccess",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"scheduled_failures",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"ScheduledFailure",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_samples",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerSummarySample",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_complete_samples",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerSummaryComplete",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_parse_failures",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerSummaryParseFailures",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_processed",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerProcessed",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_failed",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerFailed",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_retryable",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerRetryable",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Sum"},ReturnData:true},
            {Id:"worker_max_queue_lag",MetricStat:{Metric:{Namespace:"TrackMCP/RefreshScheduler",MetricName:"WorkerMaxQueueLagMs",Dimensions:[{Name:"FunctionName",Value:$function_name}]},Period:300,Stat:"Maximum"},ReturnData:true}
          ]')
          raw=$(aws cloudwatch get-metric-data \
            --region "$AWS_REGION" \
            --metric-data-queries "$queries" \
            --start-time "$start_time" \
            --end-time "$end_time" \
            --scan-by TimestampDescending \
            --output json)
          scheduled_successes=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="scheduled_successes") | .Values[]] | add // 0')
          scheduled_failures=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="scheduled_failures") | .Values[]] | add // 0')
          worker_samples=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_samples") | .Values[]] | add // 0')
          worker_complete_samples=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_complete_samples") | .Values[]] | add // 0')
          worker_parse_failures=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_parse_failures") | .Values[]] | add // 0')
          worker_processed=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_processed") | .Values[]] | add // 0')
          worker_failed=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_failed") | .Values[]] | add // 0')
          worker_retryable=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_retryable") | .Values[]] | add // 0')
          worker_max_queue_lag_ms=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_max_queue_lag") | .Values[]] | max // 0')
          worker_metrics_available=$(printf '%s' "$raw" | jq '[.MetricDataResults[] | select(.Id=="worker_samples") | .Values[]] | length > 0')
          scheduled_successes_available=true
          printf '%s' "$raw" | jq --argjson scheduled_successes "$scheduled_successes" --argjson scheduled_failures "$scheduled_failures" --argjson scheduled_successes_available "$scheduled_successes_available" --argjson worker_samples "$worker_samples" --argjson worker_complete_samples "$worker_complete_samples" --argjson worker_parse_failures "$worker_parse_failures" --argjson worker_processed "$worker_processed" --argjson worker_failed "$worker_failed" --argjson worker_retryable "$worker_retryable" --argjson worker_max_queue_lag_ms "$worker_max_queue_lag_ms" --argjson worker_metrics_available "$worker_metrics_available" '{enabled:true,datapoints:[.MetricDataResults[] | {id:.Id,values:.Values,timestamps:.Timestamps}],invocations:([.MetricDataResults[] | select(.Id=="invocations") | .Values[]] | add // 0),errors:([.MetricDataResults[] | select(.Id=="errors") | .Values[]] | add // 0),scheduled_successes:$scheduled_successes,scheduled_failures:$scheduled_failures,scheduled_successes_available:$scheduled_successes_available,worker_summary:{available:$worker_metrics_available,samples:$worker_samples,complete_samples:$worker_complete_samples,parse_failures:$worker_parse_failures,processed:$worker_processed,failed:$worker_failed,retryable:$worker_retryable,max_queue_lag_ms:$worker_max_queue_lag_ms}}' > "$output"

      - name: Collect recent redacted worker summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refresh-health"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          curl --fail-with-body --silent --show-error \
            -H "authorization: Bearer $GH_TOKEN" \
            -H 'accept: application/vnd.github+json' \
            "$api/actions/workflows/founder-os-refresh-worker.yml/runs?status=completed&per_page=12" \
            > "$RUNNER_TEMP/refresh-health/runs.json"
          : > "$RUNNER_TEMP/refresh-health/runs.ndjson"
          while IFS=$'\t' read -r run_id created_at conclusion event; do
            artifacts=$(curl --fail-with-body --silent --show-error \
              -H "authorization: Bearer $GH_TOKEN" \
              -H 'accept: application/vnd.github+json' \
              "$api/actions/runs/$run_id/artifacts")
            artifact_id=$(printf '%s' "$artifacts" | jq -r --arg name "refresh-worker-summary-$run_id" '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n 1)
            [ -n "$artifact_id" ] || continue
            archive="$RUNNER_TEMP/refresh-health/$run_id.zip"
            curl --fail-with-body --silent --show-error -L \
              -H "authorization: Bearer $GH_TOKEN" \
              -H 'accept: application/vnd.github+json' \
              "$api/actions/artifacts/$artifact_id/zip" -o "$archive"
            summary=$(unzip -p "$archive" '*.json' | jq -c 'select(type == "object")' | head -n 1)
            [ -n "$summary" ] || continue
            printf '%s\n' "$summary" | jq -c --argjson run_id "$run_id" --arg created_at "$created_at" --arg conclusion "$conclusion" --arg event "$event" '. + {run_id:$run_id, created_at:$created_at, conclusion:$conclusion, event:$event}' >> "$RUNNER_TEMP/refresh-health/runs.ndjson"
          done < <(jq -r '.workflow_runs[] | [.id, .created_at, .conclusion, .event] | @tsv' "$RUNNER_TEMP/refresh-health/runs.json")
          node trackmcp-nextjs/scripts/refresh-worker-health-report.mjs \
            "$RUNNER_TEMP/refresh-health/runs.ndjson" \
            "$RUNNER_TEMP/refresh-health/aws-scheduler.json" \
            > "$RUNNER_TEMP/refresh-health/report.json"

      - name: Publish bounded health report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/refresh-health/report.json"
          if [ -f "$report" ]; then
            state=$(jq -r '.state' "$report")
            reasons=$(jq -r '(.reasons // []) | join(",")' "$report")
            echo "### Refresh worker sequence health"
            echo "- State: $state"
            echo "- Reasons: $reasons"
            echo "- Samples: $(jq -r '.sample_count' "$report") / $(jq -r '.minimum_samples' "$report")"
            echo "- Current evaluation samples: $(jq -r '.evaluation_sample_count' "$report") (window $(jq -r '.evaluation_window_ms' "$report") ms)"
            echo "- Scheduled samples: $(jq -r '.scheduled_sample_count' "$report") / $(jq -r '.minimum_scheduled_samples' "$report")"
            echo "- Scheduled cadence gate: $(jq -r '.scheduled_cadence_gate.status' "$report") ($(jq -r '.scheduled_cadence_gate.evidence' "$report"))"
            echo "- AWS scheduler cadence gate: $(jq -r '.aws_scheduler_cadence_gate.status' "$report") ($(jq -r '.aws_scheduler_cadence_gate.evidence' "$report"))"
            echo "- AWS end-to-end cadence gate: $(jq -r '.aws_end_to_end_cadence_gate.status' "$report") ($(jq -r '.aws_end_to_end_cadence_gate.evidence' "$report"))"
            echo "- AWS worker freshness gate: $(jq -r '.worker_freshness_gate.status' "$report") ($(jq -r '.worker_freshness_gate.evidence' "$report"))"
            echo "- Max queue lag (ms): $(jq -r '.max_queue_lag_ms' "$report")"
            echo "- AWS scheduler evidence: $(jq -r '.scheduler_evidence | if .healthy then "healthy" else "not-healthy" end' "$report")"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            if [ "$state" = "warning" ]; then
              echo "::warning::Refresh worker sequence health requires attention: $reasons"
              # GitHub scheduled workflows can miss a tick. Recover only when
              # no worker is currently running; the worker's lease fencing and
              # concurrency group remain the final duplicate-work boundary.
              api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
              active=$(curl --fail-with-body --silent --show-error \
                -H "authorization: Bearer $GH_TOKEN" \
                -H 'accept: application/vnd.github+json' \
                "$api/actions/workflows/founder-os-refresh-worker.yml/runs?status=in_progress&per_page=1" \
                | jq -r '.total_count // 0')
              latest_created=$(curl --fail-with-body --silent --show-error \
                -H "authorization: Bearer $GH_TOKEN" \
                -H 'accept: application/vnd.github+json' \
                "$api/actions/workflows/founder-os-refresh-worker.yml/runs?status=completed&per_page=1" \
                | jq -r '.workflow_runs[0].created_at // empty')
              now_epoch=$(date -u +%s)
              latest_epoch=0
              if [ -n "$latest_created" ]; then
                latest_epoch=$(date -u -d "$latest_created" +%s)
              fi
              latest_age=$((now_epoch - latest_epoch))
              if [ "$active" -eq 0 ] && [ "$latest_age" -gt 1200 ]; then
                curl --fail-with-body --silent --show-error -X POST \
                  -H "authorization: Bearer $GH_TOKEN" \
                  -H 'accept: application/vnd.github+json' \
                  -H 'content-type: application/json' \
                  "$api/actions/workflows/founder-os-refresh-worker.yml/dispatches" \
                  --data '{"ref":"main"}'
                echo "- Recovery dispatch: requested (no active worker run)" >> "$GITHUB_STEP_SUMMARY"
              else
                if [ "$active" -gt 0 ]; then
                  echo "- Recovery dispatch: skipped (an active worker run already exists)" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "- Recovery dispatch: skipped (a worker run completed within the 20-minute cooldown)" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            else
              echo "- Recovery dispatch: not-needed" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error::Refresh worker health report was not produced."
            exit 1
          fi

      - name: Upload bounded health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-worker-health-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-health/report.json
          if-no-files-found: error
