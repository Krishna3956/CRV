name: TrackMCP CI

on:
  push:
  pull_request:

jobs:
  web-and-javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackmcp-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trackmcp-nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build TypeScript SDK
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm ci && npm run build
      - name: Test TypeScript SDK
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm test
      - run: python3 -m unittest discover -s ../packages/python-sdk/tests -v

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackmcp-nextjs/packages/go-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trackmcp-nextjs/packages/dotnet-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
