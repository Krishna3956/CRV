name: TrackMCP CI

on:
  push:
  pull_request:

# A branch push and the corresponding pull_request event can otherwise start
# two identical full release gates. Keep one authoritative run per ref so
# hosted-runner capacity is not consumed by duplicate work and stale jobs do
# not obscure the candidate's real result.
concurrency:
  # Pull-request and push events use different refs; key PR runs by number so
  # the two event types still collapse to one authoritative candidate.
  # Push and pull_request events for the same commit must share one group;
  # using the PR number for one event and the branch ref for the other starts
  # duplicate release gates and starves the runner pool.
  group: trackmcp-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web-and-javascript:
    runs-on: ubuntu-latest
    # The full release gate, build, and packed-consumer tests are intentionally
    # comprehensive. Bound the runner so a hung dependency or test fails
    # visibly instead of leaving a candidate indefinitely indeterminate.
    timeout-minutes: 30
    env:
      # Keep the sequential release gate below the hosted runner's memory
      # ceiling. Individual package tests are bounded and do not need the
      # default multi-gigabyte V8 heap.
      NODE_OPTIONS: --max-old-space-size=2048
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackmcp-nextjs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        working-directory: trackmcp-nextjs
        # npm registry stalls must fail visibly instead of occupying the
        # hosted runner indefinitely and obscuring the candidate result.
        run: timeout --signal=TERM --kill-after=30s 10m npm ci
      - name: Audit web production dependencies
        working-directory: trackmcp-nextjs
        run: npm audit --omit=dev --audit-level=high
      - name: Build and validate Python SDK artifacts
        working-directory: packages/python-sdk
        run: |
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Run web release gate
        working-directory: trackmcp-nextjs
        # Keep the suite bounded even if the hosted runner fails to enforce
        # the job-level timeout or loses its log stream.
        run: timeout --signal=TERM --kill-after=30s 20m npm run test:release-gate
      - name: Lint web application
        working-directory: trackmcp-nextjs
        run: npm run lint
      - name: Build web application
        working-directory: trackmcp-nextjs
        run: npm run build
      - name: Build TypeScript SDK
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm ci && npm run build
      - name: Audit TypeScript SDK dependencies
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm audit --audit-level=high
      - name: Test TypeScript SDK
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm test
      - name: Test TypeScript SDK packed consumer
        working-directory: trackmcp-nextjs/packages/typescript-sdk
        run: npm run test:packed-consumer
      - name: Test TrackMCP CLI
        working-directory: trackmcp-nextjs/packages/cli
        run: npm ci && npm test
      - name: Test TrackMCP CLI packed consumer
        working-directory: trackmcp-nextjs/packages/cli
        run: npm run test:packed-consumer
      - name: Test Python SDK
        working-directory: packages/python-sdk
        run: python3 -m unittest discover -s tests -v
      - name: Run Python SDK runtime smoke
        working-directory: packages/python-sdk
        run: python3 smoke.py

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trackmcp-nextjs/packages/go-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go test ./...
      - run: go run ./smoke

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trackmcp-nextjs/packages/dotnet-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet run --project tests/TrackMcp.Smoke.csproj --configuration Release
