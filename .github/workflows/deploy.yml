name: Deploy to App Runner

# Push-to-deploy: every push to main that touches the app rebuilds the Docker
# image, pushes it to ECR, and rolls it out on AWS App Runner. Auth uses GitHub
# OIDC (no long-lived AWS keys stored). Manual runs available via "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "trackmcp-nextjs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Optional immutable 40-character commit SHA to deploy for a rollback rehearsal"
        required: false
        type: string

concurrency:
  group: deploy-app-runner
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: trackmcp-web
  IMAGE_TAG: v2     # the tag the App Runner service tracks (do not change)
  SERVICE_ARN: arn:aws:apprunner:ap-south-1:872575360367:service/trackmcp-web/5d38155bd23141cabb4546b29a4075c7
  ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the event revision first. A raw SHA supplied through the
          # manual rollback input is fetched explicitly below; actions/checkout
          # can otherwise interpret the SHA as a branch name on workflow_dispatch.
          ref: ${{ github.sha }}

      - name: Select immutable rollback revision
        if: ${{ inputs.deploy_ref != '' }}
        env:
          REQUESTED_DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy_ref must be a full immutable 40-character commit SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$REQUESTED_DEPLOY_REF"
          git checkout --detach "$REQUESTED_DEPLOY_REF"

      - name: Resolve immutable deployment SHA
        env:
          REQUESTED_DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DEPLOY_REF" && ! "$REQUESTED_DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy_ref must be a full immutable 40-character commit SHA."
            exit 1
          fi
          DEPLOY_SHA=$(git rev-parse HEAD)
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out deployment revision is not an immutable full SHA."
            exit 1
          fi
          echo "TRACKMCP_DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trackmcp-nextjs/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production-smoke dependencies
        working-directory: trackmcp-nextjs
        run: npm ci

      - name: Install Python package build dependency
        run: python3 -m pip install build

      - name: Run release gate before deployment
        working-directory: trackmcp-nextjs
        run: npm run test:release-gate

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_BASE="$REGISTRY/$ECR_REPO"
          # Build for App Runner's architecture (amd64). ubuntu-latest is amd64,
          # so this is a native build (fast, no emulation).
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY="${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN="${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}" \
            -t "$IMAGE_BASE:$IMAGE_TAG" \
            -t "$IMAGE_BASE:${TRACKMCP_DEPLOY_SHA}" \
            trackmcp-nextjs
          # :GITHUB_SHA is the immutable per-commit record; :v2 is the moving tag
          # the service pulls on deploy.
          # Keep the push output as the source of truth for both digests. The
          # GitHub OIDC role is intentionally scoped to deployment operations
          # and does not need read access to enumerate the entire ECR repo.
          docker push "$IMAGE_BASE:$IMAGE_TAG" 2>&1 | tee "$RUNNER_TEMP/deploy-tag-push.log"
          docker push "$IMAGE_BASE:${TRACKMCP_DEPLOY_SHA}" 2>&1 | tee "$RUNNER_TEMP/candidate-tag-push.log"

      - name: Verify deployment tag resolves to the candidate image
        run: |
          set -euo pipefail
          # Read the digest returned by each successful push instead of calling
          # ecr:DescribeImages, which is deliberately not granted to the deploy
          # role. Both tags are pushed from the same locally-built image, and
          # comparing the registry's returned digests still proves that the
          # mutable deployment tag and immutable candidate tag resolve alike.
          DEPLOY_TAG_DIGEST=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/deploy-tag-push.log" | tail -n 1)
          CANDIDATE_DIGEST=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/candidate-tag-push.log" | tail -n 1)
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || [[ "$CANDIDATE_DIGEST" != "$DEPLOY_TAG_DIGEST" ]]; then
            echo "::error::The mutable deployment tag does not resolve to the candidate image digest."
            exit 1
          fi
          echo "TRACKMCP_DEPLOYED_IMAGE_DIGEST=$CANDIDATE_DIGEST" >> "$GITHUB_ENV"

      - name: Trigger App Runner deployment
        run: |
          set -euo pipefail
          OP_ID=$(timeout 30s aws apprunner start-deployment \
            --service-arn "$SERVICE_ARN" \
            --region "$AWS_REGION" \
            --query OperationId --output text)
          # App Runner operation IDs are opaque service identifiers (and are
          # not guaranteed to be UUIDs). Keep the validation bounded without
          # rejecting a valid provider-generated format.
          if [[ "$OP_ID" == "None" || ! "$OP_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "::error::App Runner did not return a valid deployment operation ID."
            exit 1
          fi
          echo "TRACKMCP_DEPLOYMENT_OPERATION_ID=$OP_ID" >> "$GITHUB_ENV"
          echo "Started App Runner deployment: $OP_ID"

      - name: Wait for deployment to finish
        run: |
          set -euo pipefail
          echo "Waiting for App Runner deployment operation $TRACKMCP_DEPLOYMENT_OPERATION_ID to succeed..."
          # App Runner image rollouts can legitimately take several minutes.
          # Keep both the provider calls and the whole polling process bounded:
          # a hung runner must fail with evidence instead of remaining stale.
          deadline=$((SECONDS + 1200))
          i=0
          while (( SECONDS < deadline )); do
            i=$((i + 1))
            OP_STATUS=$(timeout 30s aws apprunner list-operations \
              --service-arn "$SERVICE_ARN" --region "$AWS_REGION" --max-results 20 \
              --query "OperationSummaryList[?Id=='$TRACKMCP_DEPLOYMENT_OPERATION_ID'].Status | [0]" --output text)
            echo "  [$i] deployment_operation=$OP_STATUS"
            case "$OP_STATUS" in
              SUCCEEDED)
                STATUS=$(timeout 30s aws apprunner describe-service \
                  --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
                  --query Service.Status --output text)
                if [[ "$STATUS" == "RUNNING" ]]; then
                  echo "Deployment operation succeeded and service is RUNNING."
                  exit 0
                fi
                echo "Deployment operation succeeded but service status is $STATUS."
                ;;
              PENDING|IN_PROGRESS|None) ;;
              FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "Deployment operation ended unexpectedly: $OP_STATUS"
                exit 1
                ;;
              *)
                echo "Unknown deployment operation status: $OP_STATUS"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deployment operation $TRACKMCP_DEPLOYMENT_OPERATION_ID to succeed and service to become RUNNING."; exit 1

      - name: Run read-only production smoke
        working-directory: trackmcp-nextjs
        run: |
          set -euo pipefail
          SERVICE_HOST=$(timeout 30s aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
            --query 'Service.ServiceUrl' --output text)
          # App Runner's ServiceUrl API field is a hostname. Add the scheme
          # only after validating the provider-owned hostname boundary.
          if [[ "$SERVICE_HOST" == "None" || ! "$SERVICE_HOST" =~ ^[a-z0-9][a-z0-9.-]*\.awsapprunner\.com$ ]]; then
            echo "::error::App Runner did not return a valid service hostname."
            exit 1
          fi
          ORIGIN="https://${SERVICE_HOST}"
          # The App Runner hostname is provider-owned routing metadata, not a
          # credential. Preserve it as a small diagnostic artifact so
          # operators can run direct-origin checks when the public edge blocks
          # authenticated pilot traffic.
          printf '%s\n' "$SERVICE_HOST" > "$RUNNER_TEMP/trackmcp-app-runner-host.txt"
          TRACKMCP_PRODUCTION_SMOKE_CONFIRM=I_UNDERSTAND_PRODUCTION_SMOKE \
          TRACKMCP_SMOKE_BASE_URL="$ORIGIN" \
          TRACKMCP_SMOKE_CANDIDATE_SHA="$TRACKMCP_DEPLOY_SHA" \
          TRACKMCP_SMOKE_IMAGE_DIGEST="$TRACKMCP_DEPLOYED_IMAGE_DIGEST" \
          TRACKMCP_SMOKE_REPORT="$RUNNER_TEMP/trackmcp-production-smoke.json" \
          npm run smoke:production-pilot

      - name: Audit runtime safety flags
        run: |
          set -euo pipefail
          # These are non-secret feature flags. Read them from the deployed
          # App Runner configuration so a successful rollout cannot silently
          # combine durable derived writes with process-local rate limiting.
          RUNTIME_FLAGS=$(timeout 30s aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables' \
            --output json)
          RATE_LIMIT_MODE=$(printf '%s' "$RUNTIME_FLAGS" | jq -r '.TRACKMCP_RATE_LIMIT_MODE // ""')
          FACT_WRITES=$(printf '%s' "$RUNTIME_FLAGS" | jq -r '.TRACKMCP_ENABLE_FACT_WRITES // "false"')
          if [[ "$RATE_LIMIT_MODE" != "" && "$RATE_LIMIT_MODE" != "memory" && "$RATE_LIMIT_MODE" != "supabase" ]]; then
            echo "::error::Deployed TRACKMCP_RATE_LIMIT_MODE is invalid: $RATE_LIMIT_MODE"
            exit 1
          fi
          if [[ "$FACT_WRITES" == "true" && "$RATE_LIMIT_MODE" != "supabase" ]]; then
            echo "::error::Deployed fact writes require TRACKMCP_RATE_LIMIT_MODE=supabase."
            exit 1
          fi
          printf '{"rate_limit_mode":"%s","fact_writes":"%s"}\n' "$RATE_LIMIT_MODE" "$FACT_WRITES" > "$RUNNER_TEMP/trackmcp-runtime-flags.json"
          echo "Runtime flags: rate_limit_mode=$RATE_LIMIT_MODE fact_writes=$FACT_WRITES"

      - name: Upload redacted production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/trackmcp-production-smoke.json
          if-no-files-found: warn

      - name: Upload App Runner host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-runner-host-${{ github.sha }}
          path: ${{ runner.temp }}/trackmcp-app-runner-host.txt
          if-no-files-found: warn

      - name: Upload redacted runtime flag evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-flags-${{ github.sha }}
          path: ${{ runner.temp }}/trackmcp-runtime-flags.json
          if-no-files-found: warn
