name: Founder OS refresh worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A scheduled run must not overlap a manually dispatched run. The worker is
# lease-fenced, but serializing the trigger avoids avoidable contention and
# makes operator retries predictable.
concurrency:
  group: founder-os-refresh-worker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Three bounded requests can each spend up to the application's 45s
    # deadline plus curl retry/connection overhead. Keep the job ceiling above
    # that serialized envelope while retaining a finite scheduler boundary.
    timeout-minutes: 4
    steps:
      - name: Authenticate to AWS to discover the worker origin
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Resolve App Runner worker endpoint
        run: |
          set -euo pipefail
          # ServiceUrl is public metadata. Never read runtime environment values.
          ORIGIN=$(aws apprunner describe-service \
            --service-arn arn:aws:apprunner:ap-south-1:872575360367:service/trackmcp-web/5d38155bd23141cabb4546b29a4075c7 \
            --query 'Service.ServiceUrl' --output text)
          if [[ ! "$ORIGIN" =~ ^[a-z0-9.-]+\.awsapprunner\.com$ ]]; then
            echo "::error::App Runner did not return a valid service hostname."
            exit 1
          fi
          echo "WORKER_URL=https://$ORIGIN/api/internal/refresh/run" >> "$GITHUB_ENV"

      - name: Run bounded refresh batches
        env:
          WORKER_SECRET: ${{ secrets.TRACKMCP_REFRESH_WORKER_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::error::Refresh worker secrets are not configured; the scheduled refresh did not run."
            exit 1
          fi
          # Each request is independently bounded by the application’s 45s
          # lease/deadline and this workflow’s 55s curl timeout. Three
          # serialized calls let a pilot backlog catch up without allowing
          # overlapping workers or an unbounded request to hold a lease.
          failed=0
          for batch in 1 2 3; do
            echo "Running bounded refresh batch $batch/3"
            if ! curl --fail-with-body --silent --show-error \
              --connect-timeout 5 \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --retry-max-time 45 \
              --max-time 55 \
              -X POST \
              -H "authorization: Bearer $WORKER_SECRET" \
              -H "content-type: application/json" \
              --data '{"max_jobs":100}' \
              "$WORKER_URL"; then
              failed=1
              echo "Batch $batch reported an unhealthy result; continuing to the next bounded batch."
            fi
          done
          exit "$failed"
