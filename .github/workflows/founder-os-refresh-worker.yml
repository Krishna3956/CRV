name: Founder OS refresh worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A scheduled run must not overlap a manually dispatched run. The worker is
# lease-fenced, but serializing the trigger avoids avoidable contention and
# makes operator retries predictable.
concurrency:
  group: founder-os-refresh-worker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Four bounded requests run concurrently. Each asks for the same small
    # resumable slice used by the AWS scheduler; keeping fan-out below the old
    # ten-by-100 recovery profile avoids saturating App Runner/Supabase while
    # still allowing a manual drain to make progress.
    timeout-minutes: 5
    steps:
      - name: Authenticate to AWS to discover the worker origin
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Resolve App Runner worker endpoint
        run: |
          set -euo pipefail
          # ServiceUrl is public metadata. Never read runtime environment values.
          ORIGIN=$(aws apprunner describe-service \
            --service-arn arn:aws:apprunner:ap-south-1:872575360367:service/trackmcp-web/5d38155bd23141cabb4546b29a4075c7 \
            --query 'Service.ServiceUrl' --output text)
          if [[ ! "$ORIGIN" =~ ^[a-z0-9.-]+\.awsapprunner\.com$ ]]; then
            echo "::error::App Runner did not return a valid service hostname."
            exit 1
          fi
          echo "WORKER_URL=https://$ORIGIN/api/internal/refresh/run" >> "$GITHUB_ENV"
          # Keep the scheduled worker on the same dedicated plaintext secret
          # as the production EventBridge scheduler. Never read the value
          # from App Runner's redacted runtime mapping or the legacy bundle.
          echo "WORKER_SECRET_ARN=arn:aws:secretsmanager:ap-south-1:872575360367:secret:trackmcp/refresh/worker-uzoExO" >> "$GITHUB_ENV"

      - name: Run bounded refresh batches
        run: |
          set -uo pipefail
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_SECRET_ARN" ]; then
            echo "::error::Refresh worker endpoint or secret ARN is not configured; the scheduled refresh did not run."
            exit 1
          fi
          WORKER_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$WORKER_SECRET_ARN" \
            --query 'SecretString' --output text)
          if [ -z "$WORKER_SECRET" ] || [ "$WORKER_SECRET" = "None" ]; then
            echo "::error::Dedicated refresh worker secret is empty; the scheduled refresh did not run."
            exit 1
          fi
          echo "::add-mask::$WORKER_SECRET"
          # App Runner can return a provider-generated 502/503 while a cold
          # instance is starting. Warm the public health route once before
          # fanning out worker leases; this is read-only and never carries the
          # worker secret. The refresh requests still retain their own retry
          # and deadline boundaries below.
          WARMUP_URL="${WORKER_URL%/api/internal/refresh/run}/api/health"
          if timeout --signal=TERM --kill-after=5s 40s curl --fail --silent --show-error \
            --connect-timeout 5 --retry 5 --retry-delay 2 --retry-all-errors \
            --retry-max-time 30 --max-time 35 "$WARMUP_URL" >/dev/null; then
            echo "App Runner health warm-up passed."
          else
            echo "::warning::App Runner health warm-up did not complete; continuing with bounded refresh retries."
          fi
          # Each request is independently bounded by the application’s 45s
          # lease/deadline and this workflow’s 55s curl timeout. Four
          # concurrent max_jobs:10 slices provide bounded drain throughput
          # without recreating the old ten-by-100 saturation profile; the
          # database claim RPC's skip-locked lease boundary prevents duplicate
          # claims.
          failed=0
          timed_out=0
          batch_dir=$(mktemp -d)
          summary_file="$RUNNER_TEMP/trackmcp-refresh-worker-summary.jsonl"
          : > "$summary_file"
          pids=()
          for batch in $(seq 1 4); do
            (
              # Keep a process-level kill boundary in addition to curl's own
              # retry timers. This protects the runner if curl or a transport
              # layer stops honoring its internal deadline.
              timeout --signal=TERM --kill-after=10s 70s curl --fail-with-body --silent --show-error \
                --connect-timeout 5 \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --retry-max-time 45 \
                --max-time 55 \
                -X POST \
                -H "authorization: Bearer $WORKER_SECRET" \
                -H "content-type: application/json" \
                --data '{"max_jobs":10}' \
                "$WORKER_URL" >"$batch_dir/$batch.json" 2>"$batch_dir/$batch.err"
            ) &
            pids+=("$!")
          done
          for batch in $(seq 1 4); do
            set +e
            wait "${pids[$((batch - 1))]}"
            status=$?
            set -e
            if jq -e 'type == "object"' "$batch_dir/$batch.json" >/dev/null 2>&1; then
              jq -c --arg batch "$batch" --argjson http_status "$((status == 0 ? 200 : 500))" \
                '{batch:($batch|tonumber), http_status:$http_status, processed:(.processed//0), succeeded:(.succeeded//0), retryable:(.retryable//0), retryable_error_codes:(.retryable_error_codes//{}), failed:(.failed//0), idle:(.idle//false), aborted:(.aborted//false), errors_count:((.errors//[])|length), max_queue_lag_ms:(.max_queue_lag_ms//0), max_attempt_count:(.max_attempt_count//0), observed_at:(.observed_at//null)}' \
                "$batch_dir/$batch.json" >>"$summary_file"
            else
              jq -cn --arg batch "$batch" --argjson http_status "$((status == 0 ? 200 : 500))" \
                '{batch:($batch|tonumber), http_status:$http_status, response_unparseable:true}' >>"$summary_file"
            fi
            if [ -s "$batch_dir/$batch.err" ]; then
              echo "Batch $batch emitted a bounded transport diagnostic; response details are retained only in the redacted summary."
            fi
            if [ "$status" -eq 28 ] || [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              # The application owns the 45s lease/deadline. A client-side
              # timeout is an expected incomplete slice, not proof that the
              # bounded worker failed; the next scheduled tick continues.
              timed_out=1
              echo "Batch $batch reached the client timeout; continuing with the next bounded slice."
            elif [ "$status" -ne 0 ]; then
              # The refresh route deliberately returns HTTP 500 when it leaves
              # retryable jobs queued so the AWS scheduler can retry them. That
              # is an expected bounded outcome, not a failed worker invocation;
              # preserve the retryable count in the redacted summary and let the
              # next tick claim the backoff-eligible work. Transport failures,
              # terminal failures, and malformed responses remain hard failures.
              if jq -e '(.retryable // 0) > 0 and (.failed // 0) == 0 and ((.errors // []) | length) == 0' "$batch_dir/$batch.json" >/dev/null 2>&1; then
                echo "Batch $batch left retryable work for the next bounded tick; continuing."
              else
                failed=1
                echo "Batch $batch reported an unhealthy result; continuing to the next bounded batch."
              fi
            fi
          done
          jq -s 'def merge_codes: reduce (.[].retryable_error_codes // {}) as $codes ({}; reduce ($codes | to_entries[]) as $entry (. ; .[$entry.key] = ([.[$entry.key] // 0, ($entry.value // 0)] | add | if . > 1000 then 1000 else . end))); {observed_at:(map(.observed_at)|map(select(. != null))|max // null), batches:length, processed:(map(.processed // 0)|add // 0), succeeded:(map(.succeeded // 0)|add // 0), retryable:(map(.retryable // 0)|add // 0), retryable_error_codes:merge_codes, failed:(map(.failed // 0)|add // 0), errors_count:(map(.errors_count // 0)|add // 0), max_queue_lag_ms:(map(.max_queue_lag_ms // 0)|max // 0), max_attempt_count:(map(.max_attempt_count // 0)|max // 0), timed_out:($timed_out == 1), workflow_failed:($failed == 1), batches_with_unparseable_response:(map(select(.response_unparseable == true))|length)}' \
            --argjson timed_out "$timed_out" --argjson failed "$failed" "$summary_file" \
            > "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json"
          # The pilot freshness budget is 15 minutes. Keep the workflow
          # transport result successful when a run safely drains or observes
          # stale work, but classify the evidence explicitly so a green job
          # cannot be mistaken for an SLO pass.
          freshness_budget_ms=900000
          jq --argjson budget "$freshness_budget_ms" \
            '. + {freshness_budget_ms:$budget, freshness_slo:(if (.timed_out // false) == true or (.batches_with_unparseable_response // 0) > 0 then "unknown" elif .max_queue_lag_ms == 0 then "no_backlog_observed" elif .max_queue_lag_ms <= $budget then "within_budget" else "stale" end), freshness_alert:(if (.timed_out // false) == true or (.batches_with_unparseable_response // 0) > 0 or .max_queue_lag_ms > $budget then "warning" else "none" end)}' \
            "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json" \
            > "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json.tmp"
          mv "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json.tmp" "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json"
          freshness_slo=$(jq -r '.freshness_slo' "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json")
          freshness_alert=$(jq -r '.freshness_alert' "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json")
          if [ "$freshness_alert" = "warning" ]; then
            echo "::warning::Refresh worker freshness is stale; max queue lag exceeded the 15-minute pilot budget."
          fi
          {
            echo "### Refresh worker health"
            printf -- '- Freshness: `%s`\n' "$freshness_slo"
            printf -- '- Alert: `%s`\n' "$freshness_alert"
            printf -- '- Max queue lag (ms): `%s`\n' "$(jq -r '.max_queue_lag_ms' "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json")"
            printf -- '- Processed: `%s`\n' "$(jq -r '.processed' "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json")"
            printf -- '- Failed: `%s`\n' "$(jq -r '.failed' "$RUNNER_TEMP/trackmcp-refresh-worker-summary.json")"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Bounded refresh summary: failed=$failed timed_out=$timed_out freshness_slo=$freshness_slo freshness_alert=$freshness_alert budget_ms=$freshness_budget_ms"
          exit "$failed"
      - name: Upload redacted refresh worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-worker-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/trackmcp-refresh-worker-summary.json
          if-no-files-found: error
