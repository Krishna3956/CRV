name: Apply AWS Supabase staging schema

# Applies only the repository-owned application migrations to the isolated
# self-hosted Supabase database. It never changes Supabase Cloud or production.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_STAGING_SCHEMA to apply repository migrations"
        required: true
        type: string
      stack_name:
        description: "CloudFormation stack name"
        required: true
        default: trackmcp-supabase-staging-24
        type: string
      reset_schema:
        description: "Type RESET_STAGING_SCHEMA only when the isolated staging public schema has no data"
        required: false
        default: NO
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::872575360367:role/GitHubActionsDeployRole
  MIGRATION_BUCKET_PREFIX: trackmcp-supabase-backups

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed migrations
        uses: actions/checkout@v4

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate the explicit staging guard
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "APPLY_STAGING_SCHEMA" ]] || {
            echo "::error::The confirm input must be exactly APPLY_STAGING_SCHEMA. No migrations were applied."
            exit 1
          }

      - name: Package reviewed migrations in the private backup bucket
        id: package
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${MIGRATION_BUCKET_PREFIX}-${ACCOUNT_ID}-${AWS_REGION}"
          OBJECT_KEY="staging/schema-migrations-${GITHUB_RUN_ID}.tgz"
          tar -czf /tmp/trackmcp-schema-migrations.tgz supabase/migrations
          aws s3 cp /tmp/trackmcp-schema-migrations.tgz "s3://${BUCKET_NAME}/${OBJECT_KEY}" \
            --sse AES256 --only-show-errors
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "object_key=$OBJECT_KEY" >> "$GITHUB_OUTPUT"
          echo "Packaged $(find supabase/migrations -type f -name '*.sql' | wc -l | tr -d ' ') reviewed migration files; SQL contents are not printed."

      - name: Apply migrations through SSM
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          RESET_SCHEMA: ${{ inputs.reset_schema }}
          BUCKET_NAME: ${{ steps.package.outputs.bucket_name }}
          OBJECT_KEY: ${{ steps.package.outputs.object_key }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue' --output text)
          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]] || {
            echo "::error::The selected staging stack has no EC2 instance output."
            exit 1
          }
          REMOTE_SCRIPT=$(cat <<'REMOTE_EOF'
          set -euo pipefail
          cd /opt/trackmcp-supabase/project
          test -f .env
          if [[ "${RESET_SCHEMA:-NO}" == "RESET_STAGING_SCHEMA" ]]; then
            if ! docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              >/tmp/trackmcp-schema-reset.log 2>&1 <<'SQL'
          drop schema if exists public cascade;
          create schema public;
          grant all on schema public to postgres;
          grant usage on schema public to anon, authenticated, service_role;
          SQL
            then
              tail -100 /tmp/trackmcp-schema-reset.log
              exit 1
            fi
            echo STAGING_PUBLIC_SCHEMA_RESET
          fi
          install -d -m 0750 /opt/trackmcp-supabase/migrations
          if ! aws s3 cp "s3://${MIGRATION_BUCKET}/${MIGRATION_OBJECT}" /tmp/trackmcp-schema-migrations.tgz --only-show-errors \
            >/tmp/trackmcp-schema-download.log 2>&1; then
            echo STAGING_SCHEMA_DOWNLOAD_FAILED
            cat /tmp/trackmcp-schema-download.log
            exit 1
          fi
          if ! tar -xzf /tmp/trackmcp-schema-migrations.tgz -C /opt/trackmcp-supabase/migrations \
            >/tmp/trackmcp-schema-extract.log 2>&1; then
            echo STAGING_SCHEMA_EXTRACT_FAILED
            cat /tmp/trackmcp-schema-extract.log
            exit 1
          fi
          if ! find /opt/trackmcp-supabase/migrations/supabase/migrations -type f -name '*.sql' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/trackmcp-application-migrations.sql 2>/tmp/trackmcp-schema-assembly.log; then
            echo STAGING_SCHEMA_ASSEMBLY_FAILED
            cat /tmp/trackmcp-schema-assembly.log
            exit 1
          fi
          if ! docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            </tmp/trackmcp-application-migrations.sql >/tmp/trackmcp-schema-apply.log 2>&1; then
            tail -100 /tmp/trackmcp-schema-apply.log
            exit 1
          fi
          if ! docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name like 'trackmcp_%'" \
            >/tmp/trackmcp-schema-postflight.log 2>&1; then
            cat /tmp/trackmcp-schema-postflight.log
            exit 1
          fi
          echo STAGING_SCHEMA_APPLIED
          REMOTE_EOF
          )
          REMOTE_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)
          COMMANDS_JSON=$(jq -Rn --arg command "export RESET_SCHEMA='$RESET_SCHEMA' MIGRATION_BUCKET='$BUCKET_NAME' MIGRATION_OBJECT='$OBJECT_KEY'; echo $REMOTE_B64 | base64 -d | bash" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TrackMCP application schema staging migration" \
            --timeout-seconds 900 \
            --parameters "$COMMANDS_JSON" \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION"
          WAITER_STATUS=$?
          set -e
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardOutputContent --output text)
          ERROR_OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query StandardErrorContent --output text)
          echo "SSM command status: $STATUS"
          echo "$OUTPUT"
          if [[ -n "$ERROR_OUTPUT" && "$ERROR_OUTPUT" != "None" ]]; then
            echo "$ERROR_OUTPUT"
          fi
          if [[ "$WAITER_STATUS" -ne 0 || "$STATUS" != "Success" || "$OUTPUT" != *STAGING_SCHEMA_APPLIED* ]]; then
            echo "::error::Staging schema migration did not report success."
            exit 1
          fi

      - name: Record migration evidence without data
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          OBJECT_KEY: ${{ steps.package.outputs.object_key }}
        run: |
          set -euo pipefail
          echo "Applied repository migrations to isolated stack $STACK_NAME."
          echo "Migration archive retained in the private backup bucket at $OBJECT_KEY."
          echo "Supabase Cloud, production DNS, App Runner configuration, live traffic, and credentials were not changed."
