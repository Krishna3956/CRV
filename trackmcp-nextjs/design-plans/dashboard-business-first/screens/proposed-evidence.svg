  <text x="260" y="96" font-family="Arial,sans-serif" font-size="14" fill="#53645b">Technical evidence behind an observed issue. The response may be bounded, redacted, or missing client-side context.</text><rect x="260" y="126" width="980" height="64" rx="10" fill="#fff4dd" stroke="#d9a23b"/><text x="286" y="151" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7b4d00">Showing a bounded result</text><text x="286" y="173" font-family="Arial,sans-serif" font-size="12" fill="#49300a">Some events may be omitted because the response is capped. Narrow the time range or scope.</text>
