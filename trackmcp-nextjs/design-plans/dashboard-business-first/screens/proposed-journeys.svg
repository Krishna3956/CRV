<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f7f9f7"/><rect width="224" height="800" fill="#fff" stroke="#d9e3dc"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14201a">trackmcp</text><g font-family="Arial,sans-serif" font-size="13" fill="#53645b"><rect x="14" y="132" width="196" height="38" rx="8" fill="#14201a"/><text x="32" y="157" fill="#fff">↝  Journeys</text><text x="32" y="208">▥  Overview</text><text x="32" y="246">◌  Adoption</text><text x="32" y="284">◴  Quality</text><text x="32" y="322">△  Issues</text><text x="28" y="374" font-size="10" letter-spacing="2" fill="#89968e">MORE</text><text x="32" y="408">Evidence</text><text x="32" y="442">Work completed</text></g>
  <rect x="224" width="1056" height="60" fill="#fff" stroke="#d9e3dc"/><text x="260" y="23" font-family="Arial,sans-serif" font-size="11" fill="#89968e">ACME MCP · PRODUCTION</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14201a">What are people trying to do?</text><rect x="1030" y="12" width="110" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1045" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">Your data⌄</text><rect x="1150" y="12" width="112" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1165" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">30 days⌄</text>
  <text x="260" y="96" font-family="Arial,sans-serif" font-size="14" fill="#53645b">Follow explicit task paths from the first request to a useful result. Do not infer completion from a session ending.</text><rect x="260" y="126" width="980" height="66" rx="10" fill="#e7f6ef" stroke="#a8d7bf"/><text x="286" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#155b42">Explicit outcome data available</text><text x="286" y="176" font-family="Arial,sans-serif" font-size="12" fill="#53645b">Started, completed, and failed workflow events are present for this period.</text>
  <rect x="260" y="220" width="980" height="210" rx="12" fill="#fff" stroke="#d9e3dc"/><text x="286" y="256" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14201a">Checkout support</text><text x="286" y="280" font-family="Arial,sans-serif" font-size="12" fill="#627169">412 explicit workflows · 75% completed · 20% stopped · 5% failed</text><line x1="340" y1="350" x2="1050" y2="350" stroke="#c3d0c8" stroke-width="3"/><circle cx="380" cy="350" r="18" fill="#2d6cdf"/><circle cx="650" cy="350" r="18" fill="#159b73"/><circle cx="930" cy="350" r="18" fill="#b56b00"/><text x="350" y="394" font-family="Arial,sans-serif" font-size="13" fill="#304038">Started</text><text x="620" y="394" font-family="Arial,sans-serif" font-size="13" fill="#304038">Completed</text><text x="900" y="394" font-family="Arial,sans-serif" font-size="13" fill="#304038">Stopped</text><text x="362" y="326" font-family="Arial,sans-serif" font-size="12" fill="#627169">412</text><text x="632" y="326" font-family="Arial,sans-serif" font-size="12" fill="#627169">309</text><text x="912" y="326" font-family="Arial,sans-serif" font-size="12" fill="#627169">82</text>
  <rect x="260" y="458" width="480" height="180" rx="12" fill="#fff4dd" stroke="#d9a23b"/><text x="286" y="492" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#14201a">Where work stops</text><text x="286" y="526" font-family="Arial,sans-serif" font-size="14" fill="#49300a">Checkout support stops after run_query</text><text x="286" y="552" font-family="Arial,sans-serif" font-size="13" fill="#627169">82 explicit stop outcomes · 20% of terminal workflows</text><rect x="286" y="580" width="130" height="30" rx="7" fill="#14201a"/><text x="304" y="600" font-family="Arial,sans-serif" font-size="12" fill="#fff">See evidence</text>
  <rect x="760" y="458" width="480" height="180" rx="12" fill="#fff" stroke="#d9e3dc"/><text x="786" y="492" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#14201a">If outcomes are missing</text><text x="786" y="526" font-family="Arial,sans-serif" font-size="14" fill="#53645b">We can show activity, but not whether work got done.</text><text x="786" y="552" font-family="Arial,sans-serif" font-size="13" fill="#627169">Add explicit workflow outcome events to measure completion.</text><text x="786" y="600" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#159b73">See setup guidance →</text>
  <rect x="840" y="80" width="350" height="54" rx="8" fill="#eaf1ff" stroke="#a9c2f2"/><text x="860" y="104" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#244d99">FOCAL POINT</text><text x="860" y="122" font-family="Arial,sans-serif" font-size="12" fill="#31568f">Explicit outcome path, not a session funnel.</text>
</svg>
