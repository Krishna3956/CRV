<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f7f9f7"/><rect width="224" height="800" fill="#fff" stroke="#d9e3dc"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14201a">trackmcp</text><rect x="14" y="322" width="196" height="38" rx="8" fill="#14201a"/><text x="32" y="347" font-family="Arial,sans-serif" font-size="13" fill="#fff">△  Issues</text><g font-family="Arial,sans-serif" font-size="13" fill="#53645b"><text x="32" y="170">▥  Overview</text><text x="32" y="208">◌  Adoption</text><text x="32" y="246">↝  Journeys</text><text x="32" y="284">◴  Quality</text><text x="28" y="412" font-size="10" letter-spacing="2" fill="#89968e">MORE</text><text x="32" y="446">Evidence</text><text x="32" y="480">Changes</text></g>
  <rect x="224" width="1056" height="60" fill="#fff" stroke="#d9e3dc"/><text x="260" y="23" font-family="Arial,sans-serif" font-size="11" fill="#89968e">ACME MCP · PRODUCTION</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14201a">What should we fix next?</text><rect x="1030" y="12" width="110" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1045" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">Your data⌄</text><rect x="1150" y="12" width="112" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1165" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">30 days⌄</text>
  <text x="260" y="96" font-family="Arial,sans-serif" font-size="14" fill="#53645b">A short, evidence-aware queue of observed signals, regression alerts, and gaps—not a feed of every event.</text><rect x="260" y="126" width="980" height="58" rx="10" fill="#fff4dd" stroke="#d9a23b"/><text x="286" y="151" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7b4d00">1 supported issue in this period</text><text x="286" y="171" font-family="Arial,sans-serif" font-size="12" fill="#49300a">Sort by evidence strength, affected scope, and next action.</text>
  <rect x="260" y="212" width="980" height="390" rx="12" fill="#fff" stroke="#d9e3dc"/><g font-family="Arial,sans-serif" font-size="12" fill="#53645b"><text x="286" y="248" font-weight="700">ISSUE</text><text x="742" y="248" font-weight="700">EVIDENCE</text><text x="892" y="248" font-weight="700">AFFECTED SCOPE</text><text x="1080" y="248" font-weight="700">NEXT ACTION</text></g><line x1="286" y1="264" x2="1214" y2="264" stroke="#d9e3dc"/><g font-family="Arial,sans-serif"><text x="286" y="302" font-size="15" font-weight="700" fill="#14201a">run_query is slower than other capabilities</text><text x="286" y="326" font-size="13" fill="#627169">Observed signal · p95 1.42s · 1,124 calls</text><rect x="742" y="288" width="114" height="24" rx="12" fill="#fff4dd"/><text x="758" y="305" font-size="11" fill="#7b4d00">Enough evidence</text><text x="892" y="302" font-size="13" fill="#304038">run_query · 30 days</text><text x="1080" y="302" font-size="13" font-weight="700" fill="#159b73">Inspect quality →</text><line x1="286" y1="350" x2="1214" y2="350" stroke="#eef2ef"/><text x="286" y="388" font-size="15" font-weight="700" fill="#14201a">Checkout journeys often stop after run_query</text><text x="286" y="412" font-size="13" fill="#627169">Explicit stop outcomes · 82 of 412 workflows</text><rect x="742" y="374" width="118" height="24" rx="12" fill="#eaf1ff"/><text x="758" y="391" font-size="11" fill="#31568f">Observed signal</text><text x="892" y="388" font-size="13" fill="#304038">Checkout · 30 days</text><text x="1080" y="388" font-size="13" font-weight="700" fill="#159b73">View journey →</text><line x1="286" y1="436" x2="1214" y2="436" stroke="#eef2ef"/><text x="286" y="474" font-size="15" font-weight="700" fill="#14201a">Not enough evidence to rank another issue</text><text x="286" y="498" font-size="13" fill="#627169">Minimum volume is not met. This is not a confirmed problem.</text><rect x="742" y="460" width="138" height="24" rx="12" fill="#f0f2f0"/><text x="758" y="477" font-size="11" fill="#627169">Insufficient evidence</text><text x="892" y="474" font-size="13" fill="#304038">Several capabilities</text><text x="1080" y="474" font-size="13" font-weight="700" fill="#159b73">Connect more data →</text></g>
  <rect x="260" y="632" width="980" height="72" rx="12" fill="#fff" stroke="#d9e3dc"/><text x="286" y="664" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#14201a">Alert boundary</text><text x="414" y="664" font-family="Arial,sans-serif" font-size="13" fill="#627169">Future regression alerts must show threshold, baseline, volume, firing/resolved state, and evidence link separately from observed signals.</text>
  <rect x="820" y="78" width="370" height="54" rx="8" fill="#fff4dd" stroke="#d9a23b"/><text x="840" y="102" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7b4d00">FOCAL POINT</text><text x="840" y="120" font-family="Arial,sans-serif" font-size="12" fill="#49300a">One next fix, with evidence strength visible.</text>
</svg>
