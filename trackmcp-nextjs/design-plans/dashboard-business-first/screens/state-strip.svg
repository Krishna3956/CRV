<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <rect width="1280" height="420" fill="#f7f9f7"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14201a">State language strip</text><text x="36" y="68" font-family="Arial,sans-serif" font-size="13" fill="#627169">The same hierarchy and source language should work across Overview, Journeys, Quality, Issues, and Evidence.</text>
  <g font-family="Arial,sans-serif"><rect x="36" y="100" width="228" height="118" rx="10" fill="#e7f6ef" stroke="#a8d7bf"/><text x="56" y="132" font-size="13" font-weight="700" fill="#155b42">Your data</text><text x="56" y="158" font-size="13" fill="#304038">Your data is connected.</text><text x="56" y="184" font-size="12" fill="#53645b">Activity observed in this period.</text><rect x="284" y="100" width="228" height="118" rx="10" fill="#eaf1ff" stroke="#a9c2f2"/><text x="304" y="132" font-size="13" font-weight="700" fill="#244d99">Example data</text><text x="304" y="158" font-size="13" fill="#304038">Illustrative workspace values.</text><text x="304" y="184" font-size="12" fill="#31568f">Connect your server to use your data.</text><rect x="532" y="100" width="228" height="118" rx="10" fill="#fff" stroke="#d9e3dc"/><text x="552" y="132" font-size="13" font-weight="700" fill="#14201a">No activity yet</text><text x="552" y="158" font-size="13" fill="#304038">Nothing observed this period.</text><text x="552" y="184" font-size="12" fill="#627169">This is not a healthy-state claim.</text><rect x="780" y="100" width="228" height="118" rx="10" fill="#fff4dd" stroke="#d9a23b"/><text x="800" y="132" font-size="13" font-weight="700" fill="#7b4d00">Not enough evidence</text><text x="800" y="158" font-size="13" fill="#49300a">Minimum volume not met.</text><text x="800" y="184" font-size="12" fill="#7b4d00">Not a confirmed failure.</text><rect x="1028" y="100" width="216" height="118" rx="10" fill="#fcecec" stroke="#e0aaaa"/><text x="1048" y="132" font-size="13" font-weight="700" fill="#8d2f2f">Could not load</text><text x="1048" y="158" font-size="13" fill="#493030">Your data is unavailable.</text><text x="1048" y="184" font-size="12" fill="#8d2f2f">Retry · filters preserved.</text></g>
  <rect x="36" y="258" width="1208" height="86" rx="10" fill="#fff" stroke="#d9e3dc"/><text x="58" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#14201a">Shared rule</text><text x="170" y="290" font-family="Arial,sans-serif" font-size="14" fill="#53645b">A source state is not a health state. A missing outcome is not a failed outcome.</text><text x="58" y="318" font-family="Arial,sans-serif" font-size="13" fill="#627169">Every state includes plain language, a recovery or next action, and the exact limitation that makes the state true.</text>
</svg>
