  <rect x="224" width="1056" height="60" fill="#fff" stroke="#d9e3dc"/><text x="260" y="23" font-family="Arial,sans-serif" font-size="11" fill="#89968e">ACME MCP · PRODUCTION</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14201a">Which capabilities are helping or hurting?</text><rect x="1030" y="12" width="110" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1045" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">Your data⌄</text><rect x="1150" y="12" width="112" height="36" fill="#fff" stroke="#c3d0c8"/><text x="1165" y="35" font-family="Arial,sans-serif" font-size="12" fill="#304038">30 days⌄</text>
  <text x="260" y="96" font-family="Arial,sans-serif" font-size="14" fill="#53645b">Compare server-observed usage, errors, speed, retries, and explicit work associations.</text><rect x="260" y="126" width="980" height="56" rx="10" fill="#eaf1ff" stroke="#a9c2f2"/><text x="286" y="151" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244d99">Server-observed capability quality</text><text x="286" y="170" font-family="Arial,sans-serif" font-size="12" fill="#31568f">Rates use eligible denominators. Unavailable metrics remain unavailable.</text>
  <rect x="260" y="210" width="980" height="360" rx="12" fill="#fff" stroke="#d9e3dc"/><text x="286" y="246" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14201a">Capability quality</text><text x="286" y="270" font-family="Arial,sans-serif" font-size="12" fill="#627169">Sorted by supported attention signal · 12,864 observed activity</text><g font-family="Arial,sans-serif" font-size="12" fill="#53645b"><text x="286" y="312" font-weight="700">CAPABILITY</text><text x="506" y="312" font-weight="700">ACTIVITY</text><text x="636" y="312" font-weight="700">ERROR RATE</text><text x="762" y="312" font-weight="700">P95</text><text x="858" y="312" font-weight="700">RETRIES</text><text x="980" y="312" font-weight="700">EVIDENCE</text><text x="1120" y="312" font-weight="700">NEXT</text></g><line x1="286" y1="326" x2="1214" y2="326" stroke="#d9e3dc"/><g font-family="Arial,sans-serif" font-size="13" fill="#304038"><text x="286" y="360">run_query</text><text x="506" y="360">1,124</text><text x="636" y="360">8.5%</text><text x="762" y="360">1.42s</text><text x="858" y="360">9.4%</text><text x="980" y="360" fill="#b56b00">Observed signal</text><text x="1120" y="360" fill="#159b73">Inspect</text><line x1="286" y1="380" x2="1214" y2="380" stroke="#eef2ef"/><text x="286" y="414">search_docs</text><text x="506" y="414">1,682</text><text x="636" y="414">1.9%</text><text x="762" y="414">286ms</text><text x="858" y="414">2.5%</text><text x="980" y="414" fill="#159b73">Enough evidence</text><text x="1120" y="414" fill="#159b73">Compare</text><line x1="286" y1="434" x2="1214" y2="434" stroke="#eef2ef"/><text x="286" y="468">get_customer</text><text x="506" y="468">12</text><text x="636" y="468">—</text><text x="762" y="468">—</text><text x="858" y="468">—</text><text x="980" y="468" fill="#b56b00">Not enough evidence</text><text x="1120" y="468" fill="#53645b">Explain</text></g><rect x="286" y="496" width="890" height="44" rx="8" fill="#fff4dd" stroke="#e6c37d"/><text x="306" y="523" font-family="Arial,sans-serif" font-size="12" fill="#7b4d00">Not enough evidence yet: this capability has fewer than the minimum eligible calls. It is not a confirmed failure.</text>
  <rect x="260" y="602" width="980" height="92" rx="12" fill="#fff" stroke="#d9e3dc"/><text x="286" y="634" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#14201a">How to read this page</text><text x="286" y="660" font-family="Arial,sans-serif" font-size="13" fill="#627169">A rate is only shown when its denominator and minimum-volume rule are satisfied. Associations are not causal claims.</text><rect x="870" y="620" width="140" height="30" rx="7" fill="#14201a"/><text x="890" y="640" font-family="Arial,sans-serif" font-size="12" fill="#fff">Open evidence</text>
  <rect x="820" y="78" width="370" height="54" rx="8" fill="#fff4dd" stroke="#d9a23b"/><text x="840" y="102" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7b4d00">FOCAL POINT</text><text x="840" y="120" font-family="Arial,sans-serif" font-size="12" fill="#49300a">The supported capability to inspect next.</text>
