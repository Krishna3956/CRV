<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f5f7f6"/>
  <rect width="248" height="800" fill="#fff" stroke="#dfe5e1"/>
  <text x="22" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#14201a">trackmcp</text>
  <rect x="12" y="58" width="224" height="56" rx="9" fill="#fff" stroke="#dfe5e1"/><text x="28" y="84" font-family="Arial,sans-serif" font-size="13" fill="#14201a">Local demo workspace</text><text x="28" y="102" font-family="Arial,sans-serif" font-size="11" fill="#89968e">Workspace</text>
  <rect x="12" y="140" width="224" height="40" rx="8" fill="#0a0a0a"/><text x="34" y="166" font-family="Arial,sans-serif" font-size="13" fill="#fff">▥  Overview</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#66736b"><text x="24" y="214" font-size="9" letter-spacing="2" fill="#9aa59f">OBSERVE</text><text x="34" y="246">⌁  Sessions</text><text x="34" y="286">▱  Workflows</text><text x="34" y="326">⌕  Trace Explorer</text><text x="24" y="370" font-size="9" letter-spacing="2" fill="#9aa59f">UNDERSTAND</text><text x="34" y="402">⚒  Tools</text><text x="34" y="442">◴  Tool quality</text><text x="34" y="482">▱  Catalog</text><text x="34" y="522">♧  Clients</text></g>
  <rect x="248" width="1032" height="60" fill="#fff" stroke="#dfe5e1"/><text x="280" y="22" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#89968e">LOCAL DEMO WORKSPACE</text><text x="280" y="45" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14201a">Overview</text><rect x="958" y="12" width="112" height="36" fill="#fff" stroke="#d9e3dc"/><text x="974" y="35" font-family="Arial,sans-serif" font-size="12" fill="#53645b">Last 30 days⌄</text><rect x="1080" y="12" width="124" height="36" fill="#fff" stroke="#d9e3dc"/><text x="1098" y="35" font-family="Arial,sans-serif" font-size="12" fill="#53645b">● Sample data</text><rect x="1212" y="12" width="36" height="36" fill="#fff" stroke="#d9e3dc"/><text x="1224" y="36" font-family="Arial,sans-serif" font-size="17" fill="#53645b">↻</text>
  <rect x="280" y="92" width="968" height="315" fill="#fff" stroke="#d9e3dc"/><text x="304" y="122" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#159b73">FIRST CONNECTION</text><text x="304" y="156" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14201a">Connect your MCP server</text><text x="304" y="184" font-family="Arial,sans-serif" font-size="14" fill="#627169">Generate a key, install the SDK, and send one event to observe the server boundary.</text><line x1="280" y1="234" x2="1248" y2="234" stroke="#d9e3dc"/><line x1="522" y1="234" x2="522" y2="407" stroke="#14201a"/><line x1="763" y1="234" x2="763" y2="407" stroke="#14201a"/><line x1="1005" y1="234" x2="1005" y2="407" stroke="#14201a"/><g font-family="Arial,sans-serif" font-size="13" fill="#304038"><text x="304" y="266">01  Create an API key</text><text x="304" y="304" fill="#fff">Generate key</text><rect x="304" y="316" width="96" height="34" fill="#0a0a0a"/><text x="320" y="338" fill="#fff">Generate key</text><text x="546" y="266">02  Install the SDK</text><text x="546" y="304" font-family="monospace" font-size="12">npm install @trackmcp/sdk</text><text x="787" y="266">03  Wrap your server</text><text x="787" y="304" fill="#159b73">View SDK guide ↗</text><text x="1028" y="266">04  Verify an event</text><text x="1028" y="304" fill="#627169">Make one tool call, then verify it here.</text></g>
  <text x="280" y="454" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0a0a0a">Overview</text><text x="280" y="482" font-family="Arial,sans-serif" font-size="14" fill="#627169">See what happened recently, identify the next investigation, and move from signal to evidence.</text><rect x="1140" y="436" width="108" height="30" fill="#eaf1ff" stroke="#a9c2f2"/><text x="1156" y="456" font-family="Arial,sans-serif" font-size="12" fill="#31568f">● Sample data</text>
  <rect x="280" y="520" width="968" height="68" fill="#eaf1ff" stroke="#a9c2f2"/><text x="340" y="548" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#14201a">Sample mode selected</text><text x="340" y="571" font-family="Arial,sans-serif" font-size="12" fill="#627169">Illustrative data is shown by explicit selection.</text>
  <g fill="#fff" stroke="#d9e3dc"><rect x="280" y="612" width="233" height="120"/><rect x="525" y="612" width="233" height="120"/><rect x="770" y="612" width="233" height="120"/><rect x="1015" y="612" width="233" height="120"/></g><g font-family="Arial,sans-serif"><text x="296" y="638" font-size="11" fill="#89968e">TOOL CALLS</text><text x="296" y="682" font-size="29" font-weight="700" fill="#14201a">8,642</text><text x="541" y="638" font-size="11" fill="#89968e">SESSIONS</text><text x="541" y="682" font-size="29" font-weight="700" fill="#14201a">1,248</text><text x="786" y="638" font-size="11" fill="#89968e">ERRORS</text><text x="786" y="682" font-size="29" font-weight="700" fill="#14201a">286</text><text x="1031" y="638" font-size="11" fill="#89968e">COMPLETION</text><text x="1031" y="682" font-size="29" font-weight="700" fill="#14201a">87%</text></g>
  <rect x="820" y="90" width="390" height="72" rx="10" fill="#fff4dd" stroke="#d9a23b"/><text x="840" y="116" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#7b4d00">ANNOTATION</text><text x="840" y="138" font-family="Arial,sans-serif" font-size="13" fill="#49300a">At 1280px, setup pushes attention and</text><text x="840" y="156" font-family="Arial,sans-serif" font-size="13" fill="#49300a">the business next action below the fold.</text>
</svg>
