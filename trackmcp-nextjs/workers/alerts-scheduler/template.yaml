AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hourly bounded invoker for the TrackMCP alert evaluator.

Parameters:
  EvaluatorUrl:
    Type: String
    AllowedPattern: '^https://[^ ]+$'
  WorkerTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the App Runner worker token as SecretString.
  EnableSchedule:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, 'true']

Resources:
  AlertsSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TRACKMCP_ALERT_EVALUATOR_URL: !Ref EvaluatorUrl
          TRACKMCP_ALERT_WORKER_TOKEN: !Sub '{{resolve:secretsmanager:${WorkerTokenSecretArn}:SecretString}}'
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: !If [ScheduleEnabled, true, false]
