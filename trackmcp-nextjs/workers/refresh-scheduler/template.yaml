AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Five-minute bounded invoker for the TrackMCP refresh worker.

Parameters:
  WorkerUrl:
    Type: String
    AllowedPattern: '^https://[^ ]+$'
  WorkerTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the refresh worker token as its plaintext SecretString.
  EnableSchedule:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FailureAlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for scheduler/Lambda failure alarms.
  SecretRefreshNonce:
    Type: String
    Default: '0'
    Description: Non-secret deployment nonce that forces re-evaluation of the Secrets Manager dynamic reference.

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, 'true']
  HasAlarmTopic: !Not [!Equals [!Ref FailureAlarmTopicArn, '']]

Resources:
  RefreshSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Sub /trackmcp/refresh-scheduler/${AWS::StackName}
      Environment:
        Variables:
          TRACKMCP_REFRESH_WORKER_URL: !Ref WorkerUrl
          TRACKMCP_REFRESH_WORKER_TOKEN: !Sub '{{resolve:secretsmanager:${WorkerTokenSecretArn}:SecretString}}'
          TRACKMCP_REFRESH_SECRET_REFRESH_NONCE: !Ref SecretRefreshNonce

  RefreshSchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeRefreshSchedulerLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RefreshSchedulerFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RefreshSchedulerDLQ.Arn

  RefreshSchedulerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  RefreshSchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: rate(5 minutes)
      State: !If [ScheduleEnabled, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt RefreshSchedulerFunction.Arn
        RoleArn: !GetAtt RefreshSchedulerInvokeRole.Arn
        Input: '{"source":"eventbridge_scheduler"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2
        DeadLetterConfig:
          Arn: !GetAtt RefreshSchedulerDLQ.Arn

  RefreshSchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RefreshSchedulerFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt RefreshSchedulerSchedule.Arn

  SchedulerLambdaFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: TrackMCP refresh scheduler Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshSchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTopic, true, false]
      AlarmActions: !If [HasAlarmTopic, [!Ref FailureAlarmTopicArn], !Ref AWS::NoValue]

  SchedulerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: TrackMCP refresh scheduler dead-letter messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RefreshSchedulerDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTopic, true, false]
      AlarmActions: !If [HasAlarmTopic, [!Ref FailureAlarmTopicArn], !Ref AWS::NoValue]

  SchedulerScheduledSuccessMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: RefreshSchedulerLogGroup
    Properties:
      LogGroupName: !Ref RefreshSchedulerLogGroup
      FilterPattern: '{ $.event = "refresh_scheduler_result" && $.scheduled = true && $.success = true }'
      MetricTransformations:
        - MetricNamespace: TrackMCP/RefreshScheduler
          MetricName: ScheduledSuccess
          MetricValue: '1'
          DefaultValue: 0

  RefreshSchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: RefreshSchedulerFunction
    Properties:
      LogGroupName: !Sub /trackmcp/refresh-scheduler/${AWS::StackName}
      RetentionInDays: 14

Outputs:
  RefreshSchedulerFunctionArn:
    Description: Lambda function invoked by the refresh schedule.
    Value: !GetAtt RefreshSchedulerFunction.Arn
  RefreshSchedulerScheduleArn:
    Description: EventBridge Scheduler schedule ARN (disabled unless enabled explicitly).
    Value: !GetAtt RefreshSchedulerSchedule.Arn
  RefreshSchedulerDLQUrl:
    Description: SQS dead-letter queue URL for failed scheduler deliveries.
    Value: !Ref RefreshSchedulerDLQ
  RefreshSchedulerLambdaAlarmName:
    Description: CloudWatch alarm for Lambda invocation errors.
    Value: !Ref SchedulerLambdaFailureAlarm
  RefreshSchedulerDLQAlarmName:
    Description: CloudWatch alarm for visible DLQ messages.
    Value: !Ref SchedulerDLQAlarm
