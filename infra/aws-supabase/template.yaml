AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Non-applied baseline for an SSM-managed EC2 host for self-hosted Supabase.
  This template deliberately does not install Supabase, create DNS, or contain
  application secrets. Review and approve the cost and IAM scope before use.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Approved VPC for the isolated Supabase host.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Approved public subnet with a route to the internet; no database ports are opened.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI parameter.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, t3.xlarge]
  RootVolumeGiB:
    Type: Number
    Default: 80
    MinValue: 40
    Description: Encrypted gp3 root volume. Size from the measured data/backup requirement.
  BackupBucketArn:
    Type: String
    Description: Existing private S3 bucket ARN for encrypted backup objects.
  SupabaseSecretArn:
    Type: String
    Description: Existing staging Supabase secret ARN; the stack reads it but does not create its value.

Resources:
  SupabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS/HTTP ingress only for the self-hosted Supabase reverse proxy
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP redirect/ACME only; application should redirect to HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Public HTTPS reverse proxy
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SupabaseInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SupabaseBackupAndSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBackupBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref BackupBucketArn
              - Sid: ReadWriteBackupObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub '${BackupBucketArn}/*'
              - Sid: ReadSupabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref SupabaseSecretArn

  SupabaseInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref SupabaseInstanceRole]

  SupabaseInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SupabaseInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SupabaseSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeGiB
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: trackmcp-supabase-staging
        - Key: ManagedBy
          Value: cloudformation
        - Key: MigrationGoal
          Value: aws-supabase
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          install -d -m 0750 /opt/trackmcp-supabase
          cat > /opt/trackmcp-supabase/PROVISIONED-BUT-NOT-CONFIGURED <<'EOF'
          Docker is installed by the reviewed infrastructure baseline.
          Supabase is intentionally not installed or started by this template.
          Follow the pinned-release deployment runbook after staging approval.
          EOF

Outputs:
  InstanceId:
    Description: EC2 instance ID for SSM administration.
    Value: !Ref SupabaseInstance
  SecurityGroupId:
    Description: Security group allowing only ports 80 and 443 inbound.
    Value: !Ref SupabaseSecurityGroup
